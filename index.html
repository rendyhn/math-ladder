{
  id: 'diff-applications', title: 'Applications of Derivatives',
  blurb: "L'Hôpital's rule, optimisation, related rates, linear approximation, concavity and the Mean Value Theorem.",
  lesson: () => T`
<h3>L'Hôpital's rule</h3>
${Key(T`<p>If $\lim \frac{f(x)}{g(x)}$ has the form $\frac{0}{0}$ or $\frac{\infty}{\infty}$, then $\displaystyle\lim\frac{f(x)}{g(x)} = \lim\frac{f'(x)}{g'(x)}$ (when the right side exists).</p>`)}
<p>$\displaystyle\lim_{x \to 0}\frac{1 - \cos 4x}{x^2} = \lim\frac{4\sin 4x}{2x} = \lim\frac{16\cos 4x}{2} = 8$ (applied twice).</p>
<h3>Optimisation</h3>
<ol><li>Write the quantity to optimise as a function of one variable (use the constraint).</li><li>Differentiate and solve $f'(x) = 0$.</li><li>Check it is a max/min (second derivative or endpoints).</li></ol>
${Ex(T`<p>Squares of side $x$ are cut from the corners of an 18 cm square sheet, and the sides folded up. $V = x(18 - 2x)^2$, $V' = (18 - 2x)(18 - 6x) = 0$ gives $x = 3$, so $V_{\max} = 3 \cdot 12^2 = 432$ cm³.</p>`)}
${Fig(planeSvg({ W: 340, x: [0, 9.5], y: [0, 500], step: [1, 100], fns: [{ f: x => x * (18 - 2 * x) ** 2, to: 9 }], pts: [[3, 432, T`max 432 cm³ at x = 3`, 'start', false, 8, -6]], segs: [[3, 0, 3, 432, 'mf-c2', true]], xl: 'x', yl: 'V', label: T`Graph of the box volume V = x(18 − 2x)² with a maximum of 432 at x = 3` }), T`$V(x) = x(18 - 2x)^2$ on $0 \le x \le 9$: the peak, where $V' = 0$, is at $x = 3$.`)}
<h3>Related rates</h3>
<p>Differentiate a relationship with respect to time. For a growing circle, $A = \pi r^2 \Rightarrow \frac{dA}{dt} = 2\pi r\frac{dr}{dt}$.</p>
<h3>Linear approximation</h3>
${Fm(T`f(a + h) \approx f(a) + f'(a)\,h \qquad \text{e.g. } \sqrt{26} \approx 5 + \frac{1}{2 \cdot 5} = 5.1`)}
${Fig(planeSvg({ W: 340, x: [15, 35], y: [3.6, 6.2], step: [5, 0.5], fns: [{ f: Math.sqrt, label: 'y = √x', at: 33, dx: 0, dy: 18, anchor: 'end' }, { f: x => 5 + (x - 25) / 10, cls: 'mf-c2', dash: true, label: T`tangent at 25`, at: 33, dx: 0, dy: -8, anchor: 'end' }], pts: [[25, 5, cP(25, 5), 'end', false, 8, -8]], label: T`Square root curve and its tangent line at x = 25` }), T`Near $x = 25$ the tangent line hugs the curve, so it gives good approximations: $\sqrt{26} \approx 5.1$ (true value $5.0990\ldots$).`)}
<h3>Concavity and the Mean Value Theorem</h3>
<p>$f'' \gt 0$: concave up; $f'' \lt 0$: concave down; an <b>inflection point</b> is where concavity changes. <b>MVT:</b> if $f$ is continuous on $[a, b]$ and differentiable inside, some $c$ in $(a, b)$ has $f'(c) = \frac{f(b) - f(a)}{b - a}$.</p>
${Fig(planeSvg({ W: 300, x: [-0.5, 2.5], y: [-1, 4.5], equal: true, fns: [{ f: x => x * x }, { f: x => 2 * x, cls: 'mf-c2', from: -0.2, to: 2.3 }, { f: x => 2 * x - 1, cls: 'mf-c4', dash: true, from: 0.2, to: 2.2 }], texts: [[0.9, 2.6, T`secant`, 'end', 'mf-small'], [1.75, 1.2, T`tangent at c`, 'start', 'mf-small']], pts: [[0, 0, 'a', 'end', false, 6, -6], [2, 4, 'b', 'end', false, 8, -4], [1, 1, 'c', 'start', false, 8, 14]], label: T`Mean value theorem: a tangent parallel to the secant from a to b` }), T`Mean Value Theorem for $f(x) = x^2$ on $[0, 2]$: the tangent at $c = 1$ is parallel to the secant (both have slope 2).`)}
${Tip(T`<p>L'Hôpital differentiates top and bottom <b>separately</b> — it is not the quotient rule.</p>`)}`,
  gens: [
    () => { const a = ri(1, 9), b = ri(1, 9), f = pick(['exp', 'ln', 'cos']); if (f === 'cos') return { q: T`Evaluate $\displaystyle\lim_{x \to 0}\frac{1 - \cos ${a === 1 ? '' : a}x}{x^2}$.`, ...FR(a * a, 2), h: hFrac, w: [fx(a, 2), '$0$', fx(a * a, 1)], s: T`L'Hôpital twice: $\frac{${a}\sin ${a}x}{2x} \to \frac{${a * a}\cos ${a}x}{2} \to \frac{${a * a}}{2}$.` }; const num = f === 'exp' ? T`e^{${a}x} - 1` : T`\ln(1 + ${a}x)`; return { q: T`Evaluate $\displaystyle\lim_{x \to 0}\frac{${num}}{${b}x}$.`, ...FR(a, b), h: hFrac, w: [fx(b, a), '$1$', '$0$'], s: T`It is $\frac{0}{0}$; differentiate top and bottom: $\frac{${f === 'exp' ? T`${a}e^{${a}x}` : T`\frac{${a}}{1 + ${a}x}`}}{${b}} \to \frac{${a}}{${b}}$.` }; },
    () => { const k = ri(1, 6), L = 6 * k, askX = chance(); return { q: T`Equal squares of side $x$ cm are cut from the corners of a ${L} cm by ${L} cm sheet, and the sides are folded up to make an open box. ${askX ? T`What value of x maximises the volume?` : T`What is the maximum possible volume?`}`, a: askX ? k : 16 * k ** 3, u: askX ? 'cm' : 'cm³', w: askX ? [2 * k, 3 * k, k / 2] : [2 * k ** 3 * 4, 36 * k ** 3, 8 * k ** 3], s: T`$V = x(${L} - 2x)^2$, $V' = (${L} - 2x)(${L} - 6x) = 0$ gives $x = ${k}$ (the other root gives zero volume). $V = ${k}(${L - 2 * k})^2 = ${16 * k ** 3}$ cm³.` }; },
    () => { const R = ri(2, 12), c = ri(1, 5); return chance() ? { q: T`The radius of a circle increases at ${c} cm/s. How fast is the area increasing when the radius is ${R} cm? Answer in terms of $\pi$.`, ...PI(2 * R * c), u: 'cm²/s', h: hPi, w: [pix(R * R * c), pix(R * c), pix(2 * R)], s: T`$\frac{dA}{dt} = 2\pi r\frac{dr}{dt} = 2\pi(${R})(${c}) = ${piT(2 * R * c)}$ cm²/s.` } : { q: T`A spherical balloon's radius grows at ${c} cm/s. How fast is its volume increasing when the radius is ${R} cm? Answer in terms of $\pi$.`, ...PI(4 * R * R * c), u: 'cm³/s', h: hPi, w: [pix(4 * R ** 3 * c, 3), pix(8 * R * c), pix(4 * R * R)], s: T`$\frac{dV}{dt} = 4\pi r^2\frac{dr}{dt} = 4\pi(${R})^2(${c}) = ${piT(4 * R * R * c)}$ cm³/s.` }; },
    () => { const n = ri(3, 10), d = pick([1, 2, 3, -1, -2]), N = n * n + d; return { q: T`Use a linear approximation of $\sqrt{x}$ at $x = ${n * n}$ to estimate $\sqrt{${N}}$.`, ...FR(2 * n * n + d, 2 * n), h: T`Type a fraction or a decimal.`, w: [fx(n * n + d, n), fx(2 * n + d, 2), `$${n}$`], s: T`$f(x) = \sqrt{x}$, $f'(x) = \frac{1}{2\sqrt{x}}$. $\sqrt{${N}} \approx ${n} + \frac{${d}}{2 \cdot ${n}} = ${frT(2 * n * n + d, 2 * n)} \approx ${M(rnd((2 * n * n + d) / (2 * n), 4))}$.` }; },
    () => { const b = 3 * rnz(-3, 3), c = ri(-9, 9), d = ri(-9, 9); return { q: T`Find the $x$-coordinate of the inflection point of $f(x) = ${poly([1, b, c, d])}$.`, a: -b / 3, neg: true, w: [b / 3, -b / 6, -b], s: T`$f''(x) = 6x ${sg(2 * b)} = 0$ gives $x = ${-b / 3}$; $f''$ changes sign there.` }; },
    () => { const p = ri(-6, 6), a = ri(-4, 3), bb = a + ri(1, 6); return { q: T`$f(x) = ${poly([1, p, 0])}$ on $[${a}, ${bb}]$. Find the value $c$ guaranteed by the Mean Value Theorem.`, a: (a + bb) / 2, neg: true, w: [(bb - a) / 2, a + bb, (a + bb) / 2 + 1], s: T`Average slope $= \frac{f(${bb}) - f(${a})}{${bb} - ${pn(a)}} = ${bb + a + p}$. $f'(c) = 2c ${sg(p)} = ${bb + a + p}$ gives $c = ${M((a + bb) / 2)}$ — the midpoint, as always for a quadratic.` }; },
  ],

{
  id: 'integration-techniques', title: 'Techniques of Integration',
  blurb: 'Substitution, integration by parts, partial fractions, trigonometric and improper integrals.',
  lesson: () => T`
${Fig(flowSvg([T`Is it a standard integral? → use the table`, T`f(g(x)) · g′(x)? → substitution`, T`product of different types? → by parts (LIATE)`, T`rational function? → partial fractions`], { W: 440, label: T`Checklist for choosing an integration technique` }), T`A quick checklist: try the questions in order.`)}
<h3>Substitution</h3>
<p>Look for a function and its derivative. With $u = g(x)$, $du = g'(x)\,dx$:</p>
${Fm(T`\int 2x(x^2 + 1)^3\,dx = \int u^3\,du = \frac{u^4}{4} + C = \frac{(x^2 + 1)^4}{4} + C`)}
<p>For definite integrals, change the limits too (or substitute back before evaluating).</p>
<h3>Integration by parts</h3>
${Key(T`$$\int u\,dv = uv - \int v\,du$$<p>Choose $u$ by <b>LIATE</b>: Logarithmic, Inverse trig, Algebraic, Trig, Exponential — whichever comes first.</p>`)}
${Ex(T`<p>$\int x e^{2x}\,dx$: $u = x$, $dv = e^{2x}dx$, so $du = dx$, $v = \frac{1}{2}e^{2x}$. Result: $\frac{x}{2}e^{2x} - \int\frac{1}{2}e^{2x}\,dx = \frac{x}{2}e^{2x} - \frac{1}{4}e^{2x} + C$.</p>`)}
<h3>Partial fractions</h3>
<p>Split a rational function into simpler pieces: $\dfrac{5x - 1}{(x - 1)(x + 2)} = \dfrac{A}{x - 1} + \dfrac{B}{x + 2}$. Multiply out and substitute $x = 1$ and $x = -2$: $A = \frac{4}{3}$, $B = \frac{11}{3}$. Each piece integrates to a logarithm.</p>
<h3>Improper integrals</h3>
${Fm(T`\int_1^\infty \frac{dx}{x^p} = \frac{1}{p - 1} \text{ for } p \gt 1 \text{ (diverges for } p \le 1) \qquad \int_0^\infty e^{-kx}\,dx = \frac{1}{k}`)}
${Fig(planeSvg({ W: 360, H: 220, x: [0, 8], y: [0, 1.4], step: [1, 0.25], tickY: 0.5, shade: [{ f: x => 1 / (x * x), from: 1, to: 8, cls: 'mf-f1' }], fns: [{ f: x => 1 / x, from: 0.5, cls: 'mf-c2', label: 'y = 1/x', at: 6, dx: 0, dy: -8, anchor: 'middle' }, { f: x => 1 / (x * x), from: 0.6 }], label: T`Areas under 1/x and 1/x² from 1 to infinity` }), T`Both curves tend to 0, but only the area under the lower curve $\frac{1}{x^2}$ (shaded) is finite: $\int_1^\infty \frac{dx}{x^2} = 1$. The area under $\frac{1}{x}$ grows like $\ln x$ without bound.`)}
${Tip(T`<p>$\int \frac{g'(x)}{g(x)}\,dx = \ln|g(x)| + C$ — spot this pattern before reaching for anything heavier.</p>`)}`,
  gens: [

    () => { const a = ri(1, 3), n = ri(1, 3), top = (a * a + 1) ** (n + 1) - 1; return { q: T`Evaluate $\displaystyle\int_0^{${a}} 2x(x^2 + 1)^{${n}}\,dx$.`, ...FR(top, n + 1), h: hFrac, w: [fx(top, n), fx((a * a + 1) ** (n + 1), n + 1), fx(top, 2 * (n + 1))], s: T`Let $u = x^2 + 1$, $du = 2x\,dx$; limits $u = 1$ to $u = ${a * a + 1}$: $\int_1^{${a * a + 1}} u^{${n}}\,du = \left[\frac{u^{${n + 1}}}{${n + 1}}\right]_1^{${a * a + 1}} = \frac{${M((a * a + 1) ** (n + 1))} - 1}{${n + 1}} = ${frT(top, n + 1)}$.` }; },

    () => { if (chance()) { const p = ri(2, 6); return { q: T`Evaluate $\displaystyle\int_1^{\infty} \frac{dx}{x^{${p}}}$.`, ...FR(1, p - 1), h: hFrac, w: [fx(1, p), fx(1, p + 1), '$\\infty$'], s: T`$\left[\frac{x^{${1 - p}}}{${1 - p}}\right]_1^{\infty} = 0 - \frac{1}{${1 - p}} = ${frT(1, p - 1)}$. It converges because $p = ${p} \gt 1$.` }; } const k = ri(1, 9); return { q: T`Evaluate $\displaystyle\int_0^{\infty} e^{-${k === 1 ? '' : k}x}\,dx$.`, ...FR(1, k), h: hFrac, w: [fx(k, 1), '$1$', '$\\infty$'], s: T`$\left[-\frac{1}{${k}}e^{-${k}x}\right]_0^{\infty} = 0 + \frac{1}{${k}} = ${frT(1, k)}$.` }; },
    () => { const c = ri(1, 6), L = c * c + 1, S = s => `$${s}$`; return { q: T`Evaluate $\displaystyle\int_0^{${c}} \frac{2x}{x^2 + 1}\,dx$.`, a: S(T`\ln ${L}`), v: Math.log(L), h: T`Answers like ln(10) are accepted.`, w: [S(T`\ln ${c * c}`), S(T`2\ln ${L}`), S(T`\frac{1}{2}\ln ${L}`)], s: T`The numerator is the derivative of the denominator: $\left[\ln(x^2 + 1)\right]_0^{${c}} = \ln ${L} - \ln 1 = \ln ${L}$.` }; },

${Ex(T`<p><b>Telescoping:</b> $\displaystyle\sum_{n=1}^{N}\frac{1}{n(n+1)} = \sum\left(\frac{1}{n} - \frac{1}{n+1}\right) = 1 - \frac{1}{N+1}$, which tends to 1.</p>`)}

<h3>Power series and Taylor series</h3>

{
  id: 'multivariable', title: 'Multivariable Calculus',
  blurb: 'Partial derivatives, gradients, directional derivatives, critical points, double integrals and Lagrange multipliers.',
  lesson: () => T`
<p>For $f(x, y)$, the <b>partial derivative</b> $f_x = \frac{\partial f}{\partial x}$ differentiates with respect to $x$ while treating $y$ as a constant (and vice versa for $f_y$). For $f = x^2y^3$: $f_x = 2xy^3$, $f_y = 3x^2y^2$.</p>
<h3>Gradient and directional derivatives</h3>
${Key(T`$$\nabla f = \left(f_x, f_y\right) \qquad D_{\mathbf{u}}f = \nabla f \cdot \mathbf{u} \quad (|\mathbf{u}| = 1)$$<p>$\nabla f$ points in the direction of steepest increase; its length is that maximum rate.</p>`)}
${Fig(planeSvg({ W: 300, x: [-3.5, 3.5], y: [-3.5, 3.5], equal: true, circles: [[0, 0, 1, 'mf-c1'], [0, 0, 2, 'mf-c1'], [0, 0, 3, 'mf-c1']], vecs: [[Math.SQRT2, Math.SQRT2, 2.4, 2.4, 'mf-c2'], [-2, 0, -3, 0, 'mf-c2'], [0, -1, 0, -1.6, 'mf-c2']], texts: [[0.5, 0.85, '1', 'middle', 'mf-small'], [1.15, 1.45, '4', 'middle', 'mf-small'], [1.9, 2.05, '9', 'middle', 'mf-small']], label: T`Contour lines of f = x² + y² with gradient arrows pointing straight outward` }), T`Contours of $f = x^2 + y^2$ (levels 1, 4, 9). The gradient $\nabla f = (2x, 2y)$ is perpendicular to each contour and points uphill.`)}
<h3>Critical points: second derivative test</h3>
<p>At a point where $f_x = f_y = 0$, let $D = f_{xx}f_{yy} - f_{xy}^2$.</p>
<ul><li>$D \gt 0$, $f_{xx} \gt 0$: local minimum. &nbsp; $D \gt 0$, $f_{xx} \lt 0$: local maximum.</li><li>$D \lt 0$: saddle point. &nbsp; $D = 0$: the test is inconclusive.</li></ul>
<h3>Double integrals</h3>
<p>Over a rectangle, integrate one variable at a time (Fubini): $\displaystyle\int_0^2\!\!\int_0^3 xy\,dy\,dx = \int_0^2 \frac{9x}{2}\,dx = 9$. In polar coordinates, $dA = r\,dr\,d\theta$.</p>
<h3>Lagrange multipliers</h3>
<p>To optimise $f$ subject to $g = c$, solve $\nabla f = \lambda\nabla g$ together with the constraint.</p>
${Ex(T`<p>Maximise $f = xy$ subject to $x + y = 10$: $(y, x) = \lambda(1, 1)$ gives $x = y = 5$, so the maximum is 25.</p>`)}

  id: 'ode', title: 'Differential Equations',
  blurb: 'Separable and linear first-order ODEs, growth and decay, and second-order linear equations.',
  lesson: () => T`
<p>A <b>differential equation</b> relates a function to its derivatives. Its <b>order</b> is the highest derivative that appears. A <b>general solution</b> contains arbitrary constants; initial conditions pick out a particular solution.</p>
<h3>Separable equations</h3>
${Ex(T`<p>$\frac{dy}{dx} = 2xy$: separate, $\int\frac{dy}{y} = \int 2x\,dx$, so $\ln|y| = x^2 + C$ and $y = Ae^{x^2}$.</p>`)}
${Fig(planeSvg({ W: 340, x: [-2, 2], y: [-3, 3], equal: true, step: [1, 1], extra: slopeField((x, y) => 2 * x * y, step(-1.75, 1.75, 0.35), step(-2.8, 2.8, 0.35), 0.24), fns: [{ f: x => Math.exp(x * x) * 0.5 }, { f: x => -Math.exp(x * x) * 0.3, cls: 'mf-c2' }, { f: x => Math.exp(x * x) * 1.5, cls: 'mf-c3' }], label: T`Slope field of dy/dx = 2xy with three solution curves y = A e^(x²)` }), T`The slope field of $y' = 2xy$: each short segment shows the slope at that point. Solution curves $y = Ae^{x^2}$ follow the segments.`)}
<p>Special case: $\frac{dy}{dt} = ky$ gives $y = y_0e^{kt}$ — exponential growth ($k \gt 0$) or decay ($k \lt 0$). With half-life $T$, the amount left is $N_0\left(\frac{1}{2}\right)^{t/T}$.</p>
<h3>First-order linear equations</h3>
${Key(T`<p>For $y' + P(x)y = Q(x)$, multiply by the <b>integrating factor</b> $\mu(x) = e^{\int P(x)\,dx}$. Then $(\mu y)' = \mu Q$, so $y = \frac{1}{\mu}\int \mu Q\,dx$.</p>`)}
<h3>Second-order linear, constant coefficients</h3>
<p>For $ay'' + by' + cy = 0$, try $y = e^{rx}$ to get the <b>characteristic equation</b> $ar^2 + br + c = 0$.</p>
${Tbl([T`Roots`, T`General solution`], [[T`real, distinct $r_1, r_2$`, T`$y = C_1e^{r_1x} + C_2e^{r_2x}$`], [T`repeated $r$`, T`$y = (C_1 + C_2x)e^{rx}$`], [T`complex $\alpha \pm \beta i$`, T`$y = e^{\alpha x}(C_1\cos\beta x + C_2\sin\beta x)$`]])}
${FigRow([[planeSvg({ W: 250, H: 180, x: [0, 6], y: [-1, 1.2], ticks: false, xl: 't', fns: [{ f: t => 2 * Math.exp(-t) - Math.exp(-2 * t) }], label: T`Solution for real roots: decays without oscillating` }), T`Real roots: no oscillation`], [planeSvg({ W: 250, H: 180, x: [0, 6], y: [-1, 1.2], ticks: false, xl: 't', fns: [{ f: t => Math.exp(-0.3 * t) * Math.cos(3 * t), cls: 'mf-c2' }, { f: t => Math.exp(-0.3 * t), cls: 'mf-grid', dash: true }, { f: t => -Math.exp(-0.3 * t), cls: 'mf-grid', dash: true }], label: T`Solution for complex roots: oscillation inside a decaying envelope` }), T`Complex roots $\alpha \pm \beta i$: oscillation`]], T`The roots of the characteristic equation decide the shape: real roots give pure exponentials, complex roots give waves (damped when $\alpha \lt 0$).`)}
${Ex(T`<p>$y'' + 4y = 0$: $r^2 + 4 = 0$, $r = \pm 2i$, so $y = C_1\cos 2x + C_2\sin 2x$ — simple harmonic motion.</p>`)}
${Tip(T`<p>For a repeated root, $C_1e^{rx} + C_2e^{rx}$ is really only one solution; the extra factor $x$ gives the second.</p>`)}`,

{
  id: 'linear-algebra', title: 'Linear Algebra',
  blurb: 'Determinants, rank, linear systems, independence, eigenvalues and eigenvectors.',
  lesson: () => T`
<h3>Linear systems and rank</h3>
<p>A system $A\mathbf{x} = \mathbf{b}$ is solved by row-reducing the augmented matrix $[A \mid \mathbf{b}]$ to echelon form. The <b>rank</b> of $A$ is the number of pivots (non-zero rows in echelon form).</p>
${Key(T`<p><b>Rank–nullity:</b> for an $m \times n$ matrix, $\text{rank}(A) + \text{nullity}(A) = n$. A square $A$ is invertible $\iff \det A \ne 0 \iff$ its columns are linearly independent $\iff \text{rank} = n$.</p>`)}
<h3>Determinants</h3>
${Fm(T`\det\begin{pmatrix} a & b & c \\ d & e & f \\ g & h & i \end{pmatrix} = a(ei - fh) - b(di - fg) + c(dh - eg)`)}
<p>Useful properties for $n \times n$ matrices: $\det(AB) = \det A \det B$, $\det(A^T) = \det A$, $\det(A^{-1}) = \frac{1}{\det A}$, $\det(kA) = k^n\det A$. Cramer's rule: $x_i = \frac{\det A_i}{\det A}$.</p>
<h3>Eigenvalues and eigenvectors</h3>
${Key(T`$$A\mathbf{v} = \lambda\mathbf{v},\; \mathbf{v} \ne \mathbf{0} \qquad\Longleftrightarrow\qquad \det(A - \lambda I) = 0$$<p>For a $2 \times 2$ matrix: $\lambda^2 - (\text{tr}\,A)\lambda + \det A = 0$. The eigenvalues sum to the trace and multiply to the determinant.</p>`)}
${Ex(T`<p>$A = \begin{pmatrix} 4 & 1 \\ 2 & 3 \end{pmatrix}$: $\lambda^2 - 7\lambda + 10 = 0$, so $\lambda = 2, 5$. For $\lambda = 5$: $(A - 5I)\mathbf{v} = 0$ gives $\mathbf{v} = \begin{pmatrix} 1 \\ 1 \end{pmatrix}$.</p>`)}
${Fig(planeSvg({ W: 340, x: [-2, 6], y: [-4.5, 6], equal: true, step: [1, 1], tickX: 2, tickY: 2, vecs: [[0, 0, 5, 5, 'mf-c1'], [0, 0, 2, -4, 'mf-c2'], [0, 0, 4, 2, 'mf-c4']], segs: [[0, 0, 1, 1, 'mf-line'], [0, 0, 1, -2, 'mf-line'], [0, 0, 1, 0, 'mf-line']], pts: [[1, 1, 'v₁', 'end', false, 6, -4], [1, -2, 'v₂', 'end', false, 6, 4], [1, 0, 'u', 'middle', false, 0, 18]], texts: [[5, 4.3, 'Av₁ = 5v₁', 'end'], [2.2, -4, 'Av₂ = 2v₂', 'start'], [4.2, 2, 'Au', 'start']], label: T`Eigenvectors (1, 1) and (1, −2) are stretched along their own lines by 5 and 2; the vector (1, 0) is turned to (4, 2)` }), T`$A = \begin{pmatrix} 4 & 1 \\ 2 & 3 \end{pmatrix}$ stretches its eigenvectors along their own lines (by 5 and by 2). An ordinary vector like $\mathbf{u} = (1, 0)$ is knocked off its line, to $(4, 2)$.`)}
<p>If $A$ has $n$ independent eigenvectors, it is <b>diagonalisable</b>: $A = PDP^{-1}$, with eigenvectors as the columns of $P$ and eigenvalues on the diagonal of $D$.</p>
${Tip(T`<p>$\det(2A) = 2^n\det A$, not $2\det A$ — every one of the $n$ rows is scaled.</p>`)}`,

{
  id: 'inference', title: 'Statistical Inference',
  blurb: 'Sampling distributions, confidence intervals, hypothesis tests, errors and regression.',
  lesson: () => T`
<p>We use a <b>sample</b> statistic (like $\bar{x}$) to estimate a <b>population</b> parameter (like $\mu$). By the <b>Central Limit Theorem</b>, for large $n$ the sample mean is approximately normal with mean $\mu$ and <b>standard error</b> $\frac{\sigma}{\sqrt{n}}$.</p>
<h3>Confidence intervals</h3>
${Fm(T`\bar{x} \pm z^*\frac{\sigma}{\sqrt{n}} \qquad z^* = 1.645 \;(90\%),\; 1.96 \;(95\%),\; 2.576 \;(99\%)`)}
${Fig(planeSvg({ W: 400, H: 190, x: [-3.6, 3.6], y: [0, 0.45], step: [1, 0.1], grid: false, tickX: 1, fmtY: () => '', xl: 'z', yl: ' ', shade: [{ f: normPdf, from: -1.96, to: 1.96, cls: 'mf-f1' }], fns: [{ f: normPdf }], segs: [[-1.96, 0, -1.96, normPdf(1.96), 'mf-c2'], [1.96, 0, 1.96, normPdf(1.96), 'mf-c2']], texts: [[0, 0.15, '95%', 'middle', 'mf-lab-b'], [-2.3, 0.1, F(-1.96), 'end', 'mf-small'], [2.3, 0.1, F(1.96), 'start', 'mf-small']], label: T`Standard normal curve with the middle 95 percent between −1.96 and 1.96 shaded` }), T`95% of sample means fall within $1.96$ standard errors of $\mu$ — which is why $\bar{x} \pm 1.96\frac{\sigma}{\sqrt{n}}$ catches $\mu$ 95% of the time.`)}
<p>To achieve a margin of error $E$, you need $n \ge \left(\frac{z^*\sigma}{E}\right)^2$ (round up). When $\sigma$ is unknown, use $s$ and the $t$-distribution.</p>
<h3>Hypothesis tests</h3>
<ol><li>State $H_0$ (e.g. $\mu = \mu_0$) and $H_1$.</li><li>Compute a test statistic, e.g. $z = \dfrac{\bar{x} - \mu_0}{\sigma/\sqrt{n}}$.</li><li>Find the <b>p-value</b>: the probability, assuming $H_0$, of a result at least this extreme.</li><li>If $p \le \alpha$, reject $H_0$; otherwise fail to reject it.</li></ol>
${Fig(planeSvg({ W: 400, H: 190, x: [-3.6, 3.6], y: [0, 0.45], step: [1, 0.1], grid: false, tickX: 1, fmtY: () => '', xl: 'z', yl: ' ', shade: [{ f: normPdf, from: -3.6, to: -1.96, cls: 'mf-f4' }, { f: normPdf, from: 1.96, to: 3.6, cls: 'mf-f4' }], fns: [{ f: normPdf }], segs: [[2.4, 0, 2.4, 0.2, 'mf-c2']], texts: [[-2.7, 0.07, 'α/2', 'middle', 'mf-small'], [2.9, 0.07, 'α/2', 'middle', 'mf-small'], [2.4, 0.22, T`observed z = 2.4`, 'middle', 'mf-lab-b'], [0, 0.18, T`fail to reject`, 'middle', 'mf-small']], label: T`Two-tailed test at 5 percent: rejection regions beyond ±1.96 and an observed z of 2.4 inside the right tail` }), T`A two-tailed test at $\alpha = 0.05$: the shaded tails are the rejection region. An observed $z = 2.4$ lands in it, so we reject $H_0$ (p-value $\approx 0.016$).`)}

<h3>Number theory</h3>
<p>$a \equiv b \pmod n$ means $n$ divides $a - b$; $a \bmod n$ is the remainder in $\{0, 1, \ldots, n - 1\}$. Congruences can be added and multiplied, and powers reduced step by step.</p>
${Key(T`<p><b>Euclidean algorithm:</b> $\gcd(a, b) = \gcd(b, a \bmod b)$, repeated until the remainder is 0.</p><p><b>Fermat's little theorem:</b> if $p$ is prime and $p \nmid a$, then $a^{p-1} \equiv 1 \pmod p$.</p>`)}
${Ex(T`<p>$\gcd(252, 198)$: $252 = 1 \cdot 198 + 54$, $198 = 3 \cdot 54 + 36$, $54 = 1 \cdot 36 + 18$, $36 = 2 \cdot 18$. So the gcd is 18.</p><p>$2^{100} \bmod 7$: since $2^3 = 8 \equiv 1$, $2^{100} = (2^3)^{33} \cdot 2 \equiv 2$.</p>`)}
${Fig(modClockSvg(), T`Powers of 2 modulo 7 cycle $1 \to 2 \to 4 \to 1$ every 3 steps, so $2^{100} = 2^{99} \cdot 2 \equiv 1 \cdot 2 = 2$.`)}
<p>The <b>modular inverse</b> of $a$ mod $n$ is $x$ with $ax \equiv 1 \pmod n$; it exists exactly when $\gcd(a, n) = 1$.</p>
<h3>Counting</h3>
<ul><li>Functions from a set of size $m$ to one of size $n$: $n^m$; injective ones: $n(n-1)\cdots(n-m+1)$.</li><li>Inclusion–exclusion: $|A \cup B| = |A| + |B| - |A \cap B|$.</li><li><b>Pigeonhole:</b> if more than $kn$ objects go into $n$ boxes, some box gets at least $k + 1$.</li></ul>
<h3>Recurrences and graphs</h3>
<p>A recurrence defines each term from earlier ones, like $a_n = 2a_{n-1} + 1$, $a_0 = 1$. In a graph, the <b>handshake lemma</b> says $\sum \deg(v) = 2|E|$; $K_n$ has $\binom{n}{2}$ edges; a tree on $n$ vertices has $n - 1$ edges; a connected graph has an Euler circuit iff every degree is even.</p>

  lesson: () => T`
<p>Numerical methods approximate answers that have no convenient closed form. Two kinds of error matter: <b>truncation</b> error (from the method) and <b>round-off</b> error (from finite precision).</p>
${Fm(T`\text{absolute error} = |x_{\text{true}} - x_{\text{approx}}| \qquad \text{relative error} = \frac{|x_{\text{true}} - x_{\text{approx}}|}{|x_{\text{true}}|}`)}
<h3>Root finding</h3>
<ul><li><b>Bisection:</b> if $f(a)$ and $f(b)$ have opposite signs, test the midpoint $m$ and keep the half where the sign changes. Slow but guaranteed: the error halves each step.</li><li><b>Newton–Raphson:</b> $x_{n+1} = x_n - \dfrac{f(x_n)}{f'(x_n)}$. Very fast near a simple root (quadratic convergence), but it can fail with a bad start or $f' \approx 0$.</li></ul>
${Ex(T`<p>$\sqrt{10}$ via $f(x) = x^2 - 10$ from $x_0 = 3$: $x_1 = 3 - \frac{-1}{6} = 3.1667$, $x_2 = 3.1623$ — already correct to 4 decimal places.</p>`)}
${Fig(planeSvg({ W: 360, x: [0, 7], y: [-12, 28], step: [1, 4], tickY: 8, fns: [{ f: x => x * x - 10, from: 1.5, to: 6.6 }, { f: x => 26 + 12 * (x - 6), cls: 'mf-c2', dash: true, from: 3.4, to: 6.5 }, { f: x => (3.8333 ** 2 - 10) + 7.6667 * (x - 3.8333), cls: 'mf-c4', dash: true, from: 3, to: 4.5 }], pts: [[6, 26, 'x₀', 'end', false, 8, -4], [3.8333, 0, 'x₁', 'middle', false, 0, 18], [3.2228, 0, 'x₂', 'middle', false, 0, 18], [3.8333, 4.694]], segs: [[3.8333, 0, 3.8333, 4.694, 'mf-grid', true]], label: T`Newton's method on x² − 10 starting from x₀ = 6: tangent lines lead to x₁ ≈ 3.83 and x₂ ≈ 3.22` }), T`Newton's method: follow the tangent down to the axis, then repeat. From a far start $x_0 = 6$: $x_1 \approx 3.83$, $x_2 \approx 3.22$, closing in on $\sqrt{10} \approx 3.162$.`)}
<h3>Numerical integration</h3>
${Fm(T`\text{Trapezoidal: } \frac{h}{2}\big[f_0 + 2f_1 + \cdots + 2f_{n-1} + f_n\big] \qquad \text{Simpson } (n \text{ even}): \frac{h}{3}\big[f_0 + 4f_1 + 2f_2 + 4f_3 + \cdots + f_n\big]`)}
<p>Here $h = \frac{b - a}{n}$. Simpson's rule is exact for polynomials up to degree 3.</p>

${Fm(T`\text{div}\,\mathbf{F} = \nabla\cdot\mathbf{F} = P_x + Q_y + R_z \qquad \text{curl}\,\mathbf{F} = \nabla\times\mathbf{F} = (R_y - Q_z,\; P_z - R_x,\; Q_x - P_y)`)}
<p>Divergence measures outflow from a point; curl measures rotation.</p>
${FigRow([[planeSvg({ W: 240, x: [-2.4, 2.4], y: [-2.4, 2.4], equal: true, ticks: false, extra: fieldArrows((x, y) => [x, y], step(-2, 2, 1), step(-2, 2, 1), 0.75), label: T`Vector field (x, y) pointing outward from the origin` }), T`$\mathbf{F} = (x, y)$: div $= 2$, curl $= 0$`], [planeSvg({ W: 240, x: [-2.4, 2.4], y: [-2.4, 2.4], equal: true, ticks: false, extra: fieldArrows((x, y) => [-y, x], step(-2, 2, 1), step(-2, 2, 1), 0.75, 'mf-c2'), label: T`Vector field (−y, x) circulating anticlockwise` }), T`$\mathbf{F} = (-y, x)$: div $= 0$, curl $= 2$`]], T`Outflow versus rotation: the first field spreads out from the origin, the second swirls around it.`)}
<h3>Line integrals and conservative fields</h3>
${Key(T`<p>$\mathbf{F}$ is <b>conservative</b> if $\mathbf{F} = \nabla\varphi$ for a potential $\varphi$. Then $\displaystyle\int_C \mathbf{F}\cdot d\mathbf{r} = \varphi(B) - \varphi(A)$ for any path from $A$ to $B$. In the plane (simply connected domain), $(P, Q)$ is conservative iff $P_y = Q_x$.</p>`)}
${Ex(T`<p>$\mathbf{F} = (2xy, x^2 + 3)$: $P_y = 2x = Q_x$, so it is conservative with $\varphi = x^2y + 3y$. From $(0, 0)$ to $(2, 1)$: $\varphi(2, 1) - \varphi(0, 0) = 4 + 3 = 7$.</p>`)}
<h3>The big theorems</h3>

    return `<li class="q" data-i="${i}"><div class="q-meta"><span class="q-num">${i + 1}</span><span class="q-type">${esc(ui(it.type === 'mc' ? 'qMc' : 'qFill'))}</span>${t.review ? `<span class="q-topic">${esc(tTitle(TOPICS.get(it.topic)))}</span>` : ''}</div><div class="q-text">${it.q}</div>${body}<p class="feedback" aria-live="polite"></p></li>`;
  }).join('');
  const key = sh.items.map((it, i) => `<li><div class="key-row"><span class="q-num">${i + 1}</span><div class="key-ans">${it.type === 'mc' ? `<span class="key-letter">${LETTERS[it.correct]}</span>${it.choices[it.correct]}` : it.ansHTML}</div></div>${it.s ? `<div class="key-sol">${it.s}</div>` : ''}</li>`).join('');
  setHTML($('#panel'), `
    <div class="ws-controls no-print">
      <div class="ctrl"><span class="ctrl-label" id="cnt-label">${esc(ui('questions'))}</span><div class="seg" role="group" aria-labelledby="cnt-label">${[5, 10, 15, 20].map(n => `<button type="button" class="seg-btn" data-n="${n}" aria-pressed="${settings.n === n}">${n}</button>`).join('')}</div></div>
      <div class="ctrl"><label class="ctrl-label" for="mode-select">${esc(ui('qType'))}</label><select id="mode-select">${Object.entries(MODE_KEYS).map(([k, v]) => `<option value="${k}"${settings.mode === k ? ' selected' : ''}>${esc(ui(v))}</option>`).join('')}</select></div>
      <div class="ctrl-actions"><button type="button" class="btn btn-primary" data-act="new">${ICON.refresh}${esc(ui('newSheet'))}</button><button type="button" class="btn" data-act="print-q">${ICON.print}${esc(ui('printQ'))}</button></div>
    </div>
    <section class="sheet" aria-label="${esc(ui('worksheet'))}">
      <header class="sheet-head">
        <div class="sheet-title"><p class="kicker">${esc(ui('practiceSheet', lvName(lv)))}</p><h2>${esc(tTitle(t))}</h2></div>
        <dl class="sheet-meta"><div><dt>${esc(ui('sheet'))}</dt><dd>#${id}</dd></div><div><dt>${esc(ui('questions'))}</dt><dd>${sh.items.length}</dd></div><div><dt>${esc(ui('type'))}</dt><dd>${esc(ui(MODE_KEYS[sh.mode]))}</dd></div></dl>
        <div class="print-only name-line"><span>${esc(ui('name'))} ____________________________</span><span>${esc(ui('klass'))} ________</span><span>${esc(ui('date'))} ______________</span><span>${esc(ui('score'))} ______ / ${sh.items.length}</span></div>
        ${sourceLine()}
      </header>
      <p class="sheet-note no-print">${ui('fillNote')}</p>
      <ol class="qs">${qs}</ol>
      <div class="check-bar no-print"><button type="button" class="btn btn-primary" data-act="check">${ICON.check}${esc(ui('checkAnswers'))}</button><button type="button" class="btn btn-ghost" data-act="clear">${esc(ui('clearAnswers'))}</button><p class="score" role="status"></p></div>
    </section>
    <section class="key-sec" aria-label="${esc(ui('answerKey'))}">
      <div class="key-head no-print">
        <button type="button" class="key-toggle" data-act="toggle-key" aria-expanded="${sh.keyOpen}" aria-controls="key-body">${ICON.chev}<span>${esc(ui(sh.keyOpen ? 'hideKey' : 'showKey'))}</span></button>
        <div class="key-actions"><button type="button" class="btn btn-small" data-act="print-key">${ICON.print}${esc(ui('printKey'))}</button><button type="button" class="btn btn-small" data-act="print-both">${ICON.print}${esc(ui('printBoth'))}</button></div>
      </div>
      <div class="key-body reveal${sh.keyOpen ? '' : ' collapsed'}" id="key-body">
        <header class="print-only key-print-head"><p class="kicker">${esc(ui('keyHead', lvName(lv)))}</p><h2>${esc(tTitle(t))}</h2><p>${esc(ui('sheetNo', id))}</p>${sourceLine()}</header>
        <ol class="key-list">${key}</ol>
      </div>
    </section>`);
  if (sh.checked) checkSheet(false);
}

/* ---------------- checking ---------------- */
function currentSheet() { return current.view === 'topic' ? sheets.get(current.id) : null; }
function checkSheet(announce = true) {
  const sh = currentSheet(); if (!sh) return;
  let right = 0, blank = 0;
  const fbs = [];
  sh.items.forEach((it, i) => {
    const li = main.querySelector(`.q[data-i="${i}"]`); if (!li) return;
    const fb = li.querySelector('.feedback'); li.classList.remove('is-right', 'is-wrong', 'is-blank');
    let res;
    if (it.type === 'mc') {
      const a = sh.answers[i]; res = a == null ? null : a === it.correct;
      li.querySelectorAll('.choice').forEach((c, j) => { c.classList.toggle('is-answer', j === it.correct); c.classList.toggle('is-miss', j === a && a !== it.correct); });
    } else res = checkFill(it.check, sh.answers[i]);
    const correctTxt = it.type === 'mc' ? `${LETTERS[it.correct]} — ${it.choices[it.correct]}` : it.ansHTML;
    if (res === null) { blank++; li.classList.add('is-blank'); fb.innerHTML = `<span class="fb-tag">${esc(ui('notAnswered'))}</span> ${esc(ui('answerColon'))} ${correctTxt}`; }
    else if (res) { right++; li.classList.add('is-right'); fb.innerHTML = `<span class="fb-tag">${esc(ui('correct'))}</span>`; }
    else { li.classList.add('is-wrong'); fb.innerHTML = `<span class="fb-tag">${esc(ui('notQuite'))}</span> ${esc(ui('answerColon'))} ${correctTxt}`; }
    if (mjState === 'failed') fb.innerHTML = fallbackStr(fb.innerHTML);
    fbs.push(fb);
  });
  sh.checked = true;
  const score = main.querySelector('.score');
  if (score) score.innerHTML = `<b>${esc(ui('scoreLine', right, sh.items.length))}</b>${blank ? ` · ${esc(ui('unanswered', blank))}` : ''}`;
  fbs.forEach(typeset);
  if (announce) { const first = main.querySelector('.q.is-wrong, .q.is-blank'); if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}

/* ---------------- printing ---------------- */
function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => { toastEl.hidden = true; }, 8000); }
function doPrint(kind) {
  document.body.dataset.print = kind;
  let framed = false; try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) toast(ui('printToast'));
  mjChain.then(() => setTimeout(() => { try { window.print(); } catch (e) { /* blocked */ } }, 80));
}
window.addEventListener('afterprint', () => { delete document.body.dataset.print; });

/* ---------------- languages ---------------- */
const LANG_FONTS = { zh: 'Noto+Sans+SC', ja: 'Noto+Sans+JP', ko: 'Noto+Sans+KR', ar: 'Noto+Sans+Arabic', fa: 'Vazirmatn', ru: 'Noto+Sans' };
const HTML_LANG = { zh: 'zh-Hans' };
const packLoads = {};
function loadPack(code) {
  if (code === 'en' || I18N_PACKS[code]) return Promise.resolve(true);
  if (!packLoads[code]) packLoads[code] = new Promise(res => {
    const s = document.createElement('script');
    s.src = `lang/${code}.js`; s.async = true;
    s.onload = () => res(!!I18N_PACKS[code]); s.onerror = () => { delete packLoads[code]; res(false); };
    document.head.appendChild(s);
  });
  return packLoads[code];
}
function applyChrome() {
  const code = I18N.lang, root = document.documentElement;
  root.lang = HTML_LANG[code] || code; root.dir = I18N.conf.dir;
  if (LANG_FONTS[code]) {
    let l = $('#lang-font'); if (!l) { l = document.createElement('link'); l.id = 'lang-font'; l.rel = 'stylesheet'; document.head.appendChild(l); }
    const href = `https://fonts.googleapis.com/css2?family=${LANG_FONTS[code]}:wght@400;700;800&display=swap`;
    if (l.href !== href) l.href = href;
  }
  $('#menu-btn').setAttribute('aria-label', ui('showTopics'));
  $('#brand-tag').textContent = ui('brandTag');
  $('label[for="topic-search"]').textContent = ui('searchLabel');
  $('#lang-label').textContent = ui('language');
  updateThemeBtn();
  $('#lang-code').textContent = code.toUpperCase();
  langSel.value = code;
  updatePrintStyle();
}
async function changeLang(code, persist = true) {
  const ok = await loadPack(code);
  if (!ok) { toast(ui('langFail')); code = 'en'; }
  setLang(code);
  if (persist) store.set('lang', code);
  applyChrome();
  sheets.forEach((sh, id) => {   // same seed -> same numbers, now worded in the new language
    const fresh = makeSheet(TOPICS.get(id), sh.n, sh.mode, sh.seed);
    fresh.answers = sh.answers; fresh.checked = sh.checked; fresh.keyOpen = sh.keyOpen;
    sheets.set(id, fresh);
  });
  renderNav();
  if (current.view === 'home' && $('#sample')) { route(true); renderSample(false); } else route(true);
}
langSel.innerHTML = LANGS.map(([c, n]) => `<option value="${c}" lang="${HTML_LANG[c] || c}">${n}</option>`).join('');
langSel.addEventListener('change', () => changeLang(langSel.value));
function initialLang() {
  const codes = LANGS.map(l => l[0]);
  let q = null; try { q = new URLSearchParams(location.search).get('lang'); } catch (e) { /* no query */ }
  if (q && codes.includes(q)) return q;
  const saved = store.get('lang', null); if (saved && codes.includes(saved)) return saved;
  for (const l of navigator.languages || [navigator.language || 'en']) {
    const base = String(l).toLowerCase().split('-')[0].replace(/^in$/, 'id');
    if (codes.includes(base)) return base;
  }
  return 'en';
}

/* ---------------- events ---------------- */
main.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('rungs')) store.set('ladderOpen', e.target.open); }, true);
main.addEventListener('click', e => {
  const btn = e.target.closest('[data-act], .seg-btn'); if (!btn) return;
  const t = current.view === 'topic' ? TOPICS.get(current.id) : null;
  if (btn.classList.contains('seg-btn')) { settings.n = +btn.dataset.n; store.set('n', settings.n); renderPractice(t, true); return; }
  switch (btn.dataset.act) {
    case 'new': renderPractice(t, true); break;
    case 'check': checkSheet(true); break;
    case 'clear': { const sh = currentSheet(); sh.answers = {}; sh.checked = false; renderPractice(t); break; }
    case 'toggle-key': {
      const sh = currentSheet(); sh.keyOpen = !sh.keyOpen;
      $('#key-body').classList.toggle('collapsed', !sh.keyOpen);
      btn.setAttribute('aria-expanded', String(sh.keyOpen));
      btn.querySelector('span').textContent = ui(sh.keyOpen ? 'hideKey' : 'showKey');
      if (sh.keyOpen) $('#key-body').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      break;
    }
    case 'print-q': doPrint('questions'); break;
    case 'print-key': doPrint('key'); break;
    case 'print-both': doPrint('both'); break;
    case 'print-lesson': doPrint('lesson'); break;
    case 'sample-new': renderSample(); break;
    case 'sample-reveal': { const open = btn.getAttribute('aria-expanded') !== 'true'; btn.setAttribute('aria-expanded', String(open)); btn.textContent = ui(open ? 'hideAnswer' : 'showAnswer'); $('#sample-ans').classList.toggle('collapsed', !open); break; }
  }
});
main.addEventListener('change', e => {
  const el = e.target, t = current.view === 'topic' ? TOPICS.get(current.id) : null;
  if (el.id === 'mode-select') { settings.mode = el.value; store.set('mode', settings.mode); renderPractice(t, true); return; }
  if (el.type === 'radio') {
    const sh = currentSheet(), i = +el.dataset.i; sh.answers[i] = +el.value;
    el.closest('.choices').querySelectorAll('.choice').forEach(c => c.classList.toggle('sel', c.contains(el)));
  }
});
main.addEventListener('input', e => { const el = e.target; if (el.matches('.fill input')) { const sh = currentSheet(); sh.answers[+el.dataset.i] = el.value; } });
main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.fill input')) { const all = [...main.querySelectorAll('.q input[type="text"]')], k = all.indexOf(e.target); if (all[k + 1]) all[k + 1].focus(); } });

/* ---------------- boot ---------------- */
window.__mathLadder = { finalize, checkFill, canFill, TOPICS, changeLang, UI_EN };   // hook for self-tests
const startLang = initialLang();
if (startLang === 'en') { setLang('en'); applyChrome(); renderNav(); route(); }
else changeLang(startLang, false);
})();

</script>
</body>
