{
  id: 'linear-functions', title: 'Linear Functions & Graphs',
  blurb: 'Coordinates, gradient, intercepts, equations of lines, and parallel and perpendicular lines.',
  lesson: () => T`
<p>A <b>linear function</b> has a straight-line graph. In <b>gradient–intercept form</b></p>
${Fm(T`y = mx + c`)}
<p>$m$ is the <b>gradient</b> (slope): how much $y$ changes when $x$ increases by 1. $c$ is the <b>$y$-intercept</b>, where the line crosses the $y$-axis. In function notation we write $f(x) = mx + c$, so $f(3)$ means "the value when $x = 3$".</p>
<h3>Gradient from two points</h3>
${Fm(T`m = \frac{\text{rise}}{\text{run}} = \frac{y_2 - y_1}{x_2 - x_1}`)}
${Ex(T`<p>Through $(1, 2)$ and $(4, 11)$: $m = \frac{11 - 2}{4 - 1} = 3$. Substitute $(1, 2)$ into $y = 3x + c$: $2 = 3 + c$, so $c = -1$ and the line is $y = 3x - 1$.</p>`)}
${Fig(planeSvg({ W: 360, H: 300, x: [-1, 5], y: [-4, 12], step: [1, 2], fns: [{ f: x => 3 * x - 1, label: 'y = 3x − 1', at: 2.2, dx: 14, dy: 10 }], segs: [[1, 2, 4, 2, 'mf-c2', true], [4, 2, 4, 11, 'mf-c2', true]], pts: [[1, 2, cP(1, 2), 'end', false, 8, -8], [4, 11, cP(4, 11), 'end', false, 8, -4]], texts: [[2.5, 0.9, T`run = 3`], [4.15, 6.3, T`rise = 9`, 'start']], label: T`Line y = 3x − 1 through (1, 2) and (4, 11) with a slope triangle` }), T`The slope triangle: rise ÷ run $= 9 \div 3 = 3$. The line crosses the $y$-axis at $-1$.`)}
<h3>Intercepts and other forms</h3>
<p>Set $x = 0$ to find the $y$-intercept and $y = 0$ to find the $x$-intercept. A line may be written $ax + by = c$; rearrange to $y = -\frac{a}{b}x + \frac{c}{b}$ to read off the gradient. Through a point $(x_1, y_1)$ with gradient $m$: $y - y_1 = m(x - x_1)$.</p>
${Key(T`<ul><li><b>Parallel</b> lines have equal gradients: $m_1 = m_2$.</li><li><b>Perpendicular</b> lines have gradients that multiply to $-1$: $m_1 m_2 = -1$, so $m_2 = -\frac{1}{m_1}$.</li></ul>`)}
${FigRow([[planeSvg({ W: 250, x: [-4, 4], y: [-4, 4], equal: true, fns: [{ f: x => x + 1 }, { f: x => x - 2, cls: 'mf-c2' }], label: T`Two parallel lines y = x + 1 and y = x − 2` }), T`Parallel: $m_1 = m_2 = 1$`], [planeSvg({ W: 250, x: [-4, 4], y: [-4, 4], equal: true, fns: [{ f: x => 2 * x }, { f: x => -x / 2, cls: 'mf-c2' }], extra: (X, Y) => sRight(X(0), Y(0), 1 / Math.sqrt(5), -2 / Math.sqrt(5), -2 / Math.sqrt(5), -1 / Math.sqrt(5), 10), label: T`Perpendicular lines y = 2x and y = −x/2` }), T`Perpendicular:<br>$m_1 m_2 = -1$`]])}
${Tip(T`<p>Keep the order consistent: if you use $y_2 - y_1$ on top, use $x_2 - x_1$ underneath. A positive gradient rises to the right; a negative one falls.</p>`)}`,
  gens: [

{
  id: 'systems', title: 'Systems of Linear Equations',
  blurb: 'Solving two equations in two unknowns by substitution and elimination; word problems.',
  lesson: () => T`
<p>A <b>system</b> of two linear equations in $x$ and $y$ asks for values that make <i>both</i> equations true. Graphically, the solution is the point where the two lines cross.</p>
${Fig(planeSvg({ W: 340, x: [-1, 6], y: [-2, 12], step: [1, 2], fns: [{ f: x => 2 * x - 1, label: 'y = 2x − 1', at: 5, dx: -4, dy: -10, anchor: 'end' }, { f: x => 14 - 3 * x, cls: 'mf-c2', label: '3x + y = 14', at: 3.8, dx: 10, dy: -2 }], pts: [[3, 5, cP(3, 5), 'start', false, 10, 4]], label: T`Lines y = 2x − 1 and 3x + y = 14 crossing at (3, 5)` }), T`The two lines cross at $(3, 5)$ — the only point on both, so the only solution.`)}
<h3>Substitution</h3>
${Ex(T`$$\begin{cases} y = 2x - 1 \\ 3x + y = 14 \end{cases}$$<p>Substitute the first into the second: $3x + (2x - 1) = 14$, so $5x = 15$, $x = 3$, and $y = 2(3) - 1 = 5$. Solution: $(3, 5)$.</p>`)}
<h3>Elimination</h3>
${Ex(T`$$\begin{cases} 2x + 3y = 12 \\ 5x - 3y = 9 \end{cases}$$<p>Add the equations to eliminate $y$: $7x = 21$, so $x = 3$. Then $2(3) + 3y = 12$ gives $y = 2$.</p>`)}
${Key(T`<p>Multiply one or both equations first so a variable has equal (or opposite) coefficients, then subtract (or add) to eliminate it. Always check the answer in <b>both</b> original equations.</p>`)}
<h3>Special cases</h3>
${FigRow([[planeSvg({ W: 240, x: [-3, 3], y: [-3, 3], equal: true, ticks: false, fns: [{ f: x => x / 2 + 1 }, { f: x => x / 2 - 1, cls: 'mf-c2' }], label: T`Two parallel lines` }), T`No solution`], [planeSvg({ W: 240, x: [-3, 3], y: [-3, 3], equal: true, ticks: false, fns: [{ f: x => 1 - x, cls: 'mf-c2', n: 60 }, { f: x => 1 - x, dash: true }], label: T`Two lines on top of each other` }), T`Infinitely many`]])}
<p>Parallel lines (same gradient, different intercepts) never meet: <b>no solution</b>. Identical lines give <b>infinitely many</b> solutions.</p>
<h3>Word problems</h3>
<p>Two unknowns need two facts. "A farm has 30 heads and 84 legs among chickens and cows": $c + h = 30$ and $4c + 2h = 84$.</p>
${Tip(T`<p>When subtracting equations, subtract <i>every</i> term, including the right-hand sides — sign slips here cause most errors.</p>`)}`,
  gens: [

    () => { const pa = ri(6, 15), pc = ri(2, pa - 2), A = ri(10, 80), C = ri(10, 80), n = A + C, R = pa * A + pc * C; return { q: T`A cinema sold ${n} tickets for a total of ${F(R)} dollars. Adult tickets cost ${pa} dollars and child tickets cost ${pc} dollars. How many child tickets were sold?`, a: C, w: [A, Math.floor(n / 2), C + 5, C - 5], s: T`Let $a$ = adult and $c$ = child tickets: $a + c = ${n}$ and $${pa}a + ${pc}c = ${M(R)}$. Substitute $a = ${n} - c$: $${M(pa * n)} - ${pa - pc}c = ${M(R)}$, so $c = ${C}$.` }; },

{
  id: 'pythagoras', title: 'Pythagorean Theorem',
  blurb: 'Finding sides of right triangles, Pythagorean triples, distances and testing for right angles.',
  lesson: () => T`
<p>In a right triangle the longest side, opposite the right angle, is the <b>hypotenuse</b> $c$. The other two sides are the <b>legs</b> $a$ and $b$.</p>
${Fig(rightTriSvg())}
${Key(T`$$a^2 + b^2 = c^2$$<p>To find the hypotenuse, add the squares; to find a leg, subtract: $b = \sqrt{c^2 - a^2}$.</p>`)}
${Fig(pythSquaresSvg(), T`The square on the hypotenuse equals the two other squares together: $9 + 16 = 25$ (count the unit squares).`)}
${Ex(T`<p>A 10 m ladder leans against a wall with its foot 6 m from the wall. Height reached: $\sqrt{10^2 - 6^2} = \sqrt{64} = 8$ m.</p>`)}
<h3>Pythagorean triples</h3>
<p>Whole-number solutions are worth remembering, together with their multiples: $(3, 4, 5)$, $(5, 12, 13)$, $(8, 15, 17)$, $(7, 24, 25)$, and $(6, 8, 10)$, $(9, 12, 15)$, …</p>
<h3>Distance between two points</h3>
${Fm(T`d = \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}`)}
${Fig(planeSvg({ W: 320, x: [0, 6], y: [0, 5], equal: true, segs: [[1, 1, 5, 1, 'mf-c2', true], [5, 1, 5, 4, 'mf-c2', true], [1, 1, 5, 4, 'mf-c1']], pts: [[1, 1, cP(1, 1), 'end', false, 6, 16], [5, 4, cP(5, 4), 'end', false, 8, -6]], texts: [[3, 0.55, '4'], [5.25, 2.5, '3', 'start'], [2.8, 3, 'd = 5']], label: T`Distance between (1, 1) and (5, 4) as the hypotenuse of a 4 by 3 right triangle` }), T`The distance formula is Pythagoras on the grid: $d = \sqrt{4^2 + 3^2} = 5$.`)}
<h3>The converse</h3>
<p>With $c$ the longest side: if $a^2 + b^2 = c^2$ the triangle is <b>right</b>; if $a^2 + b^2 \gt c^2$ it is <b>acute</b>; if $a^2 + b^2 \lt c^2$ it is <b>obtuse</b>.</p>
${Tip(T`<p>$\sqrt{a^2 + b^2} \ne a + b$. For legs 3 and 4 the hypotenuse is 5, not 7.</p>`)}`,
  gens: [
    () => { const [a, b, c] = pick(TRIPLES), k = c < 20 ? ri(1, 3) : 1, [p, q] = shuffle([k * a, k * b]); return { q: T`A right triangle has legs of ${p} cm and ${q} cm. How long is the hypotenuse?`, a: k * c, u: 'cm', w: [p + q, k * c + 1, Math.abs(p - q), k * c * 2], s: T`$c^2 = ${p}^2 + ${q}^2 = ${p * p} + ${q * q} = ${(k * c) ** 2}$, so $c = \sqrt{${(k * c) ** 2}} = ${k * c}$ cm.` }; },
    () => { const [a, b, c] = pick(TRIPLES), k = c < 20 ? ri(1, 3) : 1, sw = chance(), L = k * (sw ? a : b), X = k * (sw ? b : a); return { q: T`The hypotenuse of a right triangle is ${k * c} m and one leg is ${L} m. How long is the other leg?`, a: X, u: 'm', w: [k * c - L, Math.round(Math.sqrt((k * c) ** 2 + L * L)), X + 1], s: T`$b = \sqrt{c^2 - a^2} = \sqrt{${(k * c) ** 2} - ${L * L}} = \sqrt{${X * X}} = ${X}$ m.` }; },
    () => { const [a, b, c] = pick(TRIPLES.slice(0, 3)), k = c <= 5 ? ri(1, 2) : 1, x1 = ri(-6, 6), y1 = ri(-6, 6), sx = pick([-1, 1]), sy = pick([-1, 1]), [dx, dy] = chance() ? [k * a, k * b] : [k * b, k * a], x2 = x1 + sx * dx, y2 = y1 + sy * dy; return { q: T`Find the distance between $${pt(x1, y1)}$ and $${pt(x2, y2)}$.`, a: k * c, w: [dx + dy, k * c + 2, Math.abs(dx - dy)], s: T`$d = \sqrt{(${M(x2)} - ${pn(x1)})^2 + (${M(y2)} - ${pn(y1)})^2} = \sqrt{${dx * dx} + ${dy * dy}} = \sqrt{${(k * c) ** 2}} = ${k * c}$.` }; },
    () => { const [a, b, c] = pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15], [8, 15, 17], [7, 24, 25]]), sw = chance(), foot = sw ? a : b, up = sw ? b : a; return { q: T`A ${c} m ladder leans against a vertical wall. Its foot is ${foot} m from the base of the wall. How high up the wall does the ladder reach?`, a: up, u: 'm', w: [c - foot, c + foot, Math.round(Math.sqrt(c * c + foot * foot))], s: T`The ladder is the hypotenuse: $h = \sqrt{${c}^2 - ${foot}^2} = \sqrt{${c * c - foot * foot}} = ${up}$ m.` }; },
    () => { let a, b, c2; do { a = ri(2, 15); b = ri(2, 15); c2 = a * a + b * b; } while (Number.isInteger(Math.sqrt(c2))); const c = rnd(Math.sqrt(c2), 2); return { q: T`A right triangle has legs ${a} cm and ${b} cm. Find the hypotenuse, rounded to 2 decimal places.`, a: c, tol: 0.011, u: 'cm', w: [a + b, rnd(Math.sqrt(Math.abs(a * a - b * b)), 2), rnd(c + 0.5, 2)], s: T`$c = \sqrt{${a}^2 + ${b}^2} = \sqrt{${c2}} \approx ${c}$ cm.` }; },
    () => { const type = pick(['Right', 'Acute', 'Obtuse']); let s; if (type === 'Right') { const [a, b, c] = pick(TRIPLES.slice(0, 4)), k = c < 10 ? ri(1, 3) : 1; s = [k * a, k * b, k * c]; } else { do { s = [ri(3, 15), ri(3, 15), ri(3, 15)].sort((x, y) => x - y); } while (s[0] + s[1] <= s[2] || (s[0] ** 2 + s[1] ** 2 > s[2] ** 2 ? 'Acute' : s[0] ** 2 + s[1] ** 2 < s[2] ** 2 ? 'Obtuse' : 'Right') !== type); } const [a, b, c] = s, lhs = a * a + b * b, L = { Right: [T`Right triangle`, T`right`], Acute: [T`Acute triangle`, T`acute`], Obtuse: [T`Obtuse triangle`, T`obtuse`] }; return { q: T`A triangle has sides ${shuffle(s).join(LS())}. What kind of triangle is it?`, a: L[type][0], alt: [L[type][1], L[type][0]], w: [L.Right[0], L.Acute[0], L.Obtuse[0]], s: T`Compare with the longest side ${c}: $${a}^2 + ${b}^2 = ${lhs}$ and $${c}^2 = ${c * c}$. Since $${lhs} ${lhs === c * c ? '=' : lhs > c * c ? '\\gt' : '\\lt'} ${c * c}$, the triangle is <b>${L[type][1]}</b>.` }; },
  ],
},

{
  id: 'circles', title: 'Circles',
  blurb: 'Circumference, area, arcs and sectors, and angles in circles.',
  lesson: () => T`
${Fig(circleSvg(), T`Parts of a circle. The diameter is twice the radius: d = 2r.`)}
<p>The ratio of any circle's circumference to its diameter is the same number, $\pi \approx 3.14159\ldots$ (often approximated as $3.14$ or $\frac{22}{7}$).</p>
${Fig(piRollSvg(), T`Roll a circle once along a line: the track is a little more than 3 diameters long — exactly $\pi d$.`)}
${Key(T`$$C = 2\pi r = \pi d \qquad\qquad A = \pi r^2$$`)}
${Ex(T`<p>Radius 5 cm: $C = 2\pi(5) = 10\pi \approx 31.4$ cm, and $A = \pi(5)^2 = 25\pi \approx 78.5$ cm². Leaving answers "in terms of $\pi$" keeps them exact.</p>`)}
<h3>Arcs and sectors</h3>
<p>A sector with central angle $\theta$ is the fraction $\frac{\theta}{360^\circ}$ of the whole circle:</p>
${Fm(T`\text{arc length} = \frac{\theta}{360^\circ} \times 2\pi r \qquad \text{sector area} = \frac{\theta}{360^\circ} \times \pi r^2`)}
${Fig(sectorSvg(), T`A $60^\circ$ sector is $\frac{60}{360} = \frac{1}{6}$ of the circle, so its arc and area are $\frac{1}{6}$ of the full circumference and area.`)}
<h3>Angles in circles</h3>
${Fig(centreAngleSvg(), T`Angle at the centre ($140^\circ$) = twice the angle at the circumference ($70^\circ$) on the same arc AB.`)}
<ul><li>The angle at the centre is <b>twice</b> the angle at the circumference standing on the same arc.</li><li>An angle in a semicircle is $90^\circ$.</li><li>A tangent is perpendicular to the radius at the point of contact.</li></ul>
${Tip(T`<p>Check whether you are given the radius or the diameter. Using $d$ in $\pi r^2$ makes the area four times too big.</p>`)}`,
  gens: [
    () => { if (chance()) { const r = ri(2, 20), useD = chance(), C = rnd(2 * 3.14 * r, 2); return { q: useD ? T`Using $\pi \approx 3.14$, find the circumference of a circle with diameter ${2 * r} cm.` : T`Using $\pi \approx 3.14$, find the circumference of a circle with radius ${r} cm.`, a: C, tol: 0.01, u: 'cm', w: [rnd(3.14 * r * r, 2), rnd(3.14 * r, 2), rnd(4 * 3.14 * r, 2)], s: T`$C = ${useD ? T`\pi d = 3.14 \times ${2 * r}` : T`2\pi r = 2 \times 3.14 \times ${r}`} = ${M(C)}$ cm.` }; } const r = 7 * ri(1, 5); return { q: T`Using $\pi \approx \frac{22}{7}$, find the circumference of a circle with radius ${r} cm.`, a: (44 * r) / 7, u: 'cm', w: [(22 * r * r) / 7, (22 * r) / 7, (88 * r) / 7], s: T`$C = 2\pi r = 2 \times \frac{22}{7} \times ${r} = ${(44 * r) / 7}$ cm.` }; },
    () => { const r = ri(2, 15), useD = chance(0.3); return { q: useD ? T`Find the area of a circle with diameter ${2 * r} cm. Leave your answer in terms of $\pi$.` : T`Find the area of a circle with radius ${r} cm. Leave your answer in terms of $\pi$.`, ...PI(r * r), u: 'cm²', h: hPi, w: [pix(2 * r), pix(4 * r * r), pix(r), pix(2 * r * r)], s: T`${useD ? T`The radius is half the diameter: ${r} cm. ` : ''}$A = \pi r^2 = \pi \times ${r}^2 = ${piT(r * r)}$ cm².` }; },
    () => { const th = pick([30, 45, 60, 72, 90, 120, 135, 150, 180, 240, 270]), r = ri(2, 12); return { q: T`A sector has radius ${r} cm and central angle $${th}^\circ$. Find its arc length in terms of $\pi$.`, ...PI(th * r, 180), u: 'cm', h: hPi, w: [pix(th * r * r, 360), pix(th * r, 360), pix(2 * r)], s: T`Arc $= \frac{${th}}{360} \times 2\pi \times ${r} = ${piT(th * r, 180)}$ cm.` }; },
    () => { const th = pick([30, 45, 60, 72, 90, 120, 135, 150, 180, 240, 270]), r = ri(2, 12); return { q: T`A sector has radius ${r} cm and central angle $${th}^\circ$. Find its area in terms of $\pi$.`, ...PI(th * r * r, 360), u: 'cm²', h: hPi, w: [pix(th * r, 180), pix(r * r), pix(th * r * r, 180)], s: T`Area $= \frac{${th}}{360} \times \pi \times ${r}^2 = ${piT(th * r * r, 360)}$ cm².` }; },
    () => { const r = ri(2, 15); return { q: T`A circle has circumference $${piT(2 * r)}$ cm. Find its area in terms of $\pi$.`, ...PI(r * r), u: 'cm²', h: hPi, w: [pix(4 * r * r), pix(2 * r), pix(r)], s: T`$2\pi r = ${piT(2 * r)}$ gives $r = ${r}$. Then $A = \pi r^2 = ${piT(r * r)}$ cm².` }; },

{
  id: 'solids', title: 'Surface Area & Volume of Solids',
  blurb: 'Prisms, cylinders, pyramids, cones and spheres.',
  lesson: () => T`
<p>A <b>prism</b> has the same cross-section all the way through, so its volume is simply the area of that cross-section times its length. A pyramid or cone that fits inside it has exactly one third of that volume.</p>
${FigW(solidsSvg([['prism', T`Prism`], ['cylinder', T`Cylinder`], ['pyramid', T`Pyramid`], ['cone', T`Cone`], ['sphere', T`Sphere`]], { label: T`A triangular prism, cylinder, pyramid, cone and sphere` }), T`Prisms and cylinders keep the same cross-section; pyramids and cones taper to a point.`)}
${Tbl([T`Solid`, T`Volume`, T`Surface area`], [[T`Prism`, T`$A_{\text{base}} \times h$`, T`sum of all faces`], [T`Cylinder`, T`$\pi r^2 h$`, T`$2\pi r^2 + 2\pi r h$`], [T`Pyramid`, T`$\frac{1}{3} A_{\text{base}} \times h$`, T`base + triangles`], [T`Cone`, T`$\frac{1}{3}\pi r^2 h$`, T`$\pi r^2 + \pi r s$`], [T`Sphere`, T`$\frac{4}{3}\pi r^3$`, T`$4\pi r^2$`]])}
<p>For a cone, $s$ is the <b>slant height</b>; by Pythagoras, $s = \sqrt{r^2 + h^2}$.</p>
${Ex(T`<p>A cylinder with $r = 3$ cm and $h = 10$ cm:</p><p>$V = \pi (3)^2 (10) = 90\pi$ cm³ $\approx 282.7$ cm³. &nbsp; $SA = 2\pi(9) + 2\pi(3)(10) = 18\pi + 60\pi = 78\pi$ cm².</p>`)}
${Key(T`<p>A cylinder's curved surface unrolls into a rectangle: one side is the height $h$, the other is the circumference $2\pi r$. That is where $2\pi r h$ comes from.</p>`)}
${Fig(cylNetSvg(), T`The net of a cylinder: two circles and a rectangle whose width is the circumference $2\pi r$.`)}
${Tip(T`<p>Hemispheres: half the sphere's volume, but the surface area is $2\pi r^2$ (curved part) $+ \pi r^2$ (flat circle) $= 3\pi r^2$.</p>`)}`,
  gens: [
    () => { const r = ri(2, 10), h = ri(2, 15); return { q: T`Find the volume of a cylinder with radius ${r} cm and height ${h} cm, in terms of $\pi$.`, ...PI(r * r * h), u: 'cm³', h: hPi, w: [pix(2 * r * h), pix(r * h), pix(2 * r * r * h), pix(r * r * h + 2 * r * r)], s: T`$V = \pi r^2 h = \pi \times ${r * r} \times ${h} = ${piT(r * r * h)}$ cm³.` }; },
    () => { let r, h; do { r = ri(2, 10); h = ri(2, 15); } while ((r * r * h) % 3 !== 0); return { q: T`Find the volume of a cone with radius ${r} cm and height ${h} cm, in terms of $\pi$.`, ...PI(r * r * h, 3), u: 'cm³', h: hPi, w: [pix(r * r * h), pix(r * h, 3), pix(2 * r * r * h, 3)], s: T`$V = \frac{1}{3}\pi r^2 h = \frac{1}{3}\pi \times ${r * r} \times ${h} = ${piT(r * r * h, 3)}$ cm³.` }; },
    () => { const r = ri(1, 9); return chance() ? { q: T`Find the volume of a sphere with radius ${r} cm, in terms of $\pi$.`, ...PI(4 * r ** 3, 3), u: 'cm³', h: hPi, w: [pix(4 * r * r), pix(4 * r ** 3), pix(r ** 3, 3)], s: T`$V = \frac{4}{3}\pi r^3 = \frac{4}{3}\pi \times ${r ** 3} = ${piT(4 * r ** 3, 3)}$ cm³.` } : { q: T`Find the surface area of a sphere with radius ${r} cm, in terms of $\pi$.`, ...PI(4 * r * r), u: 'cm²', h: hPi, w: [pix(4 * r ** 3, 3), pix(2 * r * r), pix(r * r)], s: T`$SA = 4\pi r^2 = 4\pi \times ${r * r} = ${piT(4 * r * r)}$ cm².` }; },
    () => { const r = ri(2, 9), h = ri(2, 15); return { q: T`Find the total surface area of a closed cylinder with radius ${r} cm and height ${h} cm, in terms of $\pi$.`, ...PI(2 * r * r + 2 * r * h), u: 'cm²', h: hPi, w: [pix(r * r + 2 * r * h), pix(2 * r * h), pix(r * r * h)], s: T`$SA = 2\pi r^2 + 2\pi r h = ${piT(2 * r * r)} + ${piT(2 * r * h)} = ${piT(2 * r * r + 2 * r * h)}$ cm².` }; },
    () => { const [a, b, c] = pick([[3, 4, 5], [5, 12, 13], [8, 15, 17], [6, 8, 10]]), sw = chance(), r = sw ? a : b, h = sw ? b : a; return chance() ? { q: T`A cone has radius ${r} cm and height ${h} cm. What is its slant height?`, a: c, u: 'cm', w: [r + h, Math.abs(h - r), c + 1], s: T`$s = \sqrt{r^2 + h^2} = \sqrt{${r * r} + ${h * h}} = ${c}$ cm.` } : { q: T`A cone has radius ${r} cm and slant height ${c} cm. Find its total surface area in terms of $\pi$.`, ...PI(r * r + r * c), u: 'cm²', h: hPi, w: [pix(r * c), pix(r * r + r * h), pix(r * r * c)], s: T`$SA = \pi r^2 + \pi r s = ${piT(r * r)} + ${piT(r * c)} = ${piT(r * r + r * c)}$ cm².` }; },

  ],
},

{
  id: 'statistics-jh', title: 'Statistics: Centre & Spread',
  blurb: 'Mean, median and mode from lists and frequency tables, and how new data changes them.',
  lesson: () => T`
<p>A <b>measure of centre</b> summarises a data set with one typical value; a <b>measure of spread</b> says how scattered the values are.</p>
${Tbl([T`Measure`, T`Best when…`], [[T`Mean`, T`data has no extreme values (outliers)`], [T`Median`, T`data is skewed or has outliers — e.g. house prices`], [T`Mode`, T`data is categorical — e.g. favourite colour`], [T`Range`, T`a quick sense of spread (but sensitive to outliers)`]])}
${Fig(dotPlotSvg([3, 4, 4, 5, 5, 5, 6, 6, 7, 20], { min: 2, max: 20, marks: [[5, T`median 5`, 'mf-c2'], [6.5, T`mean 6.5`, 'mf-c4']], label: T`Dot plot of ten values with one outlier at 20; the mean 6.5 is pulled to the right of the median 5` }), T`One outlier (20) drags the mean up to 6.5, while the median stays at 5 — that is why the median suits skewed data.`)}
<h3>Mean from a frequency table</h3>
${Fm(T`\bar{x} = \frac{\sum f x}{\sum f}`)}
${Ex(T`${qTable([[T`Score $x$`, '1', '2', '3', '4'], [T`Frequency $f$`, '3', '5', '8', '4']], true)}<p>$\sum f = 20$ and $\sum fx = 3 + 10 + 24 + 16 = 53$, so the mean is $\frac{53}{20} = 2.65$. The mode is 3 (highest frequency). The median is the mean of the 10th and 11th values — both 3 — so the median is 3.</p>`)}
${Fig(barsSvg([['1', 3], ['2', 5], ['3', 8, 'mf-s2'], ['4', 4]], { W: 360, H: 210, step: 2, yl: T`frequency`, label: T`Bar chart of the frequency table: score 1 three times, 2 five times, 3 eight times, 4 four times` }), T`The tallest bar is the mode (score 3). The mean, 2.65, sits a little lower because of the smaller scores.`)}
<h3>Working backwards</h3>
${Key(T`<p>$\text{total} = \text{mean} \times \text{count}$. If 5 numbers have mean 12, their total is 60 — so if four of them sum to 47, the fifth is 13.</p>`)}
<p>With an even number of values, the median is the mean of the two middle values.</p>
${Tip(T`<p>In a frequency table, divide $\sum fx$ by the total frequency $\sum f$, not by the number of rows.</p>`)}`,
  gens: [

{
  id: 'probability-jh', title: 'Probability',
  blurb: 'Sample spaces, the probability of an event, complements and expected frequency.',
  lesson: () => T`
<p>An <b>experiment</b> (rolling a die, drawing a card) has possible <b>outcomes</b>. The set of all outcomes is the <b>sample space</b> $S$; an <b>event</b> $E$ is a set of outcomes. When all outcomes are equally likely:</p>
${Fm(T`P(E) = \frac{n(E)}{n(S)}`)}
${Key(T`<ul><li>$0 \le P(E) \le 1$: 0 means impossible, 1 means certain.</li><li><b>Complement:</b> $P(\text{not } E) = 1 - P(E)$.</li><li><b>Expected frequency</b> in $n$ trials $= P(E) \times n$.</li></ul>`)}
${Ex(T`<p>A bag has 3 red, 5 blue and 2 green marbles. $P(\text{blue}) = \frac{5}{10} = \frac{1}{2}$, and $P(\text{not green}) = 1 - \frac{2}{10} = \frac{4}{5}$.</p>`)}
${Fig(numberLineSvg({ min: 0, max: 1, step: 0.1, labelEvery: 0.5, H: 104, marks: [{ v: 0.2, label: T`green`, cls: 'mf-s3' }, { v: 0.5, label: T`blue`, cls: 'mf-s1' }, { v: 0.8, label: T`not green`, cls: 'mf-s2' }], label: T`Probability scale from 0 to 1 with the marble probabilities marked` }), T`The probability scale: 0 is impossible, 1 is certain. The marbles give $P(\text{green}) = 0.2$, $P(\text{blue}) = 0.5$, $P(\text{not green}) = 0.8$.`)}
<h3>Two dice</h3>
<p>Rolling two dice gives $6 \times 6 = 36$ equally likely outcomes. A sum of 7 happens in 6 ways — (1,6), (2,5), (3,4), (4,3), (5,2), (6,1) — so $P(\text{sum} = 7) = \frac{6}{36} = \frac{1}{6}$. In general, the number of ways to get a sum $s$ is $6 - |s - 7|$.</p>
${Fig(diceGridSvg(), T`All 36 outcomes of two dice. Sums are constant along each diagonal; the six shaded cells give a sum of 7.`)}
<h3>A deck of cards</h3>
<p>52 cards: 4 suits (♠ ♣ black, ♥ ♦ red) of 13 ranks (A, 2–10, J, Q, K). There are 12 face cards (J, Q, K).</p>
${Tip(T`<p>Experimental probability (from real trials) gets closer to theoretical probability as the number of trials grows — but it rarely matches exactly.</p>`)}`,
  gens: [
    () => { const c = { red: ri(1, 9), blue: ri(1, 9), green: ri(1, 9) }, n = c.red + c.blue + c.green, col = pick(['red', 'blue', 'green']), k = c[col], nm = { red: T`red`, blue: T`blue`, green: T`green` }[col]; return { q: T`A bag contains ${c.red} red, ${c.blue} blue and ${c.green} green balls. One ball is picked at random. What is the probability that it is ${nm}?`, ...FR(k, n), h: T`Type a fraction such as 2/7.`, w: [fx(k, n - k), fx(1, 3), fx(k, n + 1), fx(n - k, n)], s: T`$P(\text{${nm}}) = \frac{\text{${nm} balls}}{\text{all balls}} = \frac{${k}}{${n}}${gcd(k, n) > 1 ? ` = ${frT(k, n)}` : ''}$.` }; },
    () => { const s = ri(2, 12), ways = 6 - Math.abs(s - 7); return { q: T`Two fair dice are rolled. What is the probability that the sum is ${s}?`, ...FR(ways, 36), h: T`Type a fraction such as 5/36.`, w: [fx(1, 11), fx(ways, 12), fx(ways + 1, 36), fx(1, 6)], s: T`There are 36 equally likely outcomes, and a sum of ${s} happens in ${ways} of them. $P = \frac{${ways}}{36}${gcd(ways, 36) > 1 ? T` = ${frT(ways, 36)}` : ''}$.` }; },
    () => { const p = ri(5, 95) / 100, ev = pick([T`it rains tomorrow`, T`a bus is late`, T`a seed germinates`, T`a team wins its next match`]); return { q: T`The probability that ${ev} is ${F(p)}. What is the probability that this does <b>not</b> happen?`, a: rnd(1 - p, 2), w: [p, rnd(1 / p, 2), rnd(0.5 - p, 2)], s: T`$P(\text{not } E) = 1 - P(E) = 1 - ${M(p)} = ${M(rnd(1 - p, 2))}$.` }; },
    () => { const [desc, k] = pick([[T`a six`, 1], [T`an even number`, 3], [T`a number greater than 4`, 2], [T`a prime number`, 3], [T`a multiple of 3`, 2]]), n = 6 * ri(5, 40); return { q: T`A fair die is rolled ${n} times. How many times would you expect to roll ${desc}?`, a: (n * k) / 6, w: [n / 6, (n * k) / 3, n / k], s: T`$P = \frac{${k}}{6}$, so the expected number is $\frac{${k}}{6} \times ${n} = ${(n * k) / 6}$.` }; },
    () => { const [desc, set] = pick([[T`an even number`, [2, 4, 6]], [T`a number less than 3`, [1, 2]], [T`a prime number`, [2, 3, 5]], [T`a factor of 6`, [1, 2, 3, 6]], [T`a number greater than 1`, [2, 3, 4, 5, 6]], [T`a square number`, [1, 4]]]); return { q: T`A fair six-sided die is rolled. What is the probability of rolling ${desc}?`, ...FR(set.length, 6), h: T`Type a fraction such as 1/3.`, w: [fx(1, 6), fx(set.length, 5), fx(6 - set.length, 6)], s: T`Favourable outcomes: ${set.join(LS())} — that is ${set.length} of 6. $P = \frac{${set.length}}{6}${gcd(set.length, 6) > 1 ? T` = ${frT(set.length, 6)}` : ''}$.` }; },
    () => { const [desc, k, why] = pick([[T`a heart`, 13, T`13 hearts`], [T`a king`, 4, T`4 kings`], [T`a red card`, 26, T`26 red cards`], [T`a red king`, 2, T`2 red kings`], [T`a face card (J, Q or K)`, 12, T`12 face cards`], [T`an ace or a king`, 8, T`4 aces and 4 kings`], [T`a black 7`, 2, T`the 7 of spades and 7 of clubs`]]); return { q: T`A card is drawn at random from a standard 52-card deck. What is the probability that it is ${desc}?`, ...FR(k, 52), h: T`Type a fraction such as 1/13.`, w: [fx(k, 13), fx(1, k), fx(k + 1, 52), fx(k, 26)], s: T`There are ${why} out of 52 cards: $P = \frac{${k}}{52} = ${frT(k, 52)}$.` }; },
  ],
},

{
  id: 'social-arith', title: 'Money Maths: Profit, Discount & Interest',
  blurb: 'Profit and loss, percentage profit, discount and tax, simple interest, gross and net weight.',
  lesson: () => T`
<p>Everyday money questions are percentage questions in disguise.</p>
${Tbl([T`Term`, T`Meaning`], [[T`Cost price (CP)`, T`what the seller paid`], [T`Selling price (SP)`, T`what the buyer pays`], [T`Profit`, T`SP − CP (when SP > CP)`], [T`Loss`, T`CP − SP (when SP < CP)`]])}
${Key(T`$$\text{profit \%} = \frac{\text{profit}}{\text{cost price}} \times 100\% \qquad\qquad \text{SP} = \text{CP} \times \left(1 + \frac{p}{100}\right)$$`)}
${Ex(T`<p>A phone bought for 400 dollars is sold for 460 dollars. Profit $= 60$, so profit % $= \frac{60}{400} \times 100\% = 15\%$.</p>`)}
<h3>Discount and tax</h3>
<p>Apply percentages one after another: a 20% discount then 10% tax on 150 dollars gives $150 \times 0.8 \times 1.1 = 132$ dollars.</p>
<h3>Simple interest</h3>
${Fm(T`I = P \times r \times t \qquad \text{(principal} \times \text{yearly rate} \times \text{years)}`)}
<p>1,500 dollars saved at 6% per year for 3 years earns $1{,}500 \times 0.06 \times 3 = 270$ dollars; the total becomes 1,770 dollars. For months, use $t = \frac{\text{months}}{12}$.</p>
${Fig(barsSvg([[T`start`, 1500], [T`year 1`, 1590], [T`year 2`, 1680], [T`year 3`, 1770, 'mf-s2']], { W: 380, H: 220, yMax: 2000, step: 500, label: T`Bar chart of a 1,500 dollar saving growing by 90 dollars each year to 1,770 dollars` }), T`Simple interest adds the same amount every year: $6\%$ of 1,500 = 90 dollars.`)}
<h3>Gross, tare and net</h3>
<p><b>Gross</b> = total weight; <b>tare</b> = weight of the packaging; <b>net</b> = gross − tare. A 50 kg sack with 2% tare has net weight $50 \times 0.98 = 49$ kg.</p>
${Tip(T`<p>Profit percentage is always based on the <b>cost</b> price, not the selling price.</p>`)}`,
  gens: [
    () => { const C = ri(3, 50) * 20, p = pick([5, 10, 15, 20, 25, 30, 40, 50]), profit = chance(), S = (C * (profit ? 100 + p : 100 - p)) / 100; return { q: profit ? T`A trader buys a bicycle for ${F(C)} dollars and sells it for ${F(S)} dollars. What is the percentage profit?` : T`A trader buys a bicycle for ${F(C)} dollars and sells it for ${F(S)} dollars. What is the percentage loss?`, a: p, u: '%', w: [rnd((Math.abs(S - C) / S) * 100, 1), Math.abs(S - C), 100 - p], s: T`${profit ? T`Profit` : T`Loss`} $= ${M(Math.abs(S - C))}$. Percentage $= \frac{${M(Math.abs(S - C))}}{${M(C)}} \times 100\% = ${p}\%$.` }; },
    () => { const C = ri(3, 50) * 20, p = pick([5, 10, 15, 20, 25, 30, 40, 50]); return { q: T`A shop buys a lamp for ${F(C)} dollars and wants to make a ${p}% profit. What should the selling price be?`, a: (C * (100 + p)) / 100, u: T`dollars`, w: [(C * p) / 100, C + p, (C * (100 - p)) / 100], s: T`$\text{SP} = ${M(C)} \times ${M((100 + p) / 100)} = ${M((C * (100 + p)) / 100)}$ dollars.` }; },
    () => { const P = ri(2, 40) * 500, r = ri(3, 12), t = ri(1, 5), I = (P * r * t) / 100, total = chance(); const period = t === 1 ? T`for 1 year` : T`for ${t} years`; return { q: total ? T`${F(P)} dollars is invested at ${r}% simple interest per year ${period}. What is the total amount at the end?` : T`${F(P)} dollars is invested at ${r}% simple interest per year ${period}. How much interest is earned?`, a: total ? P + I : I, u: T`dollars`, w: total ? [I, P + I / t, P * (1 + r / 100)] : [(P * r) / 100, P + I, I * 2], s: T`$I = P r t = ${M(P)} \times ${M(r / 100)} \times ${t} = ${M(I)}$ dollars.${total ? T` Total $= ${M(P)} + ${M(I)} = ${M(P + I)}$ dollars.` : ''}` }; },
    () => { const price = ri(4, 40) * 5, d = pick([10, 20, 25, 30]), tx = pick([5, 10, 11]), res = rnd(price * (1 - d / 100) * (1 + tx / 100), 2); return { q: T`A pair of shoes costs ${price} dollars. There is a ${d}% discount, and then ${tx}% sales tax is added to the discounted price. What is the final price?`, a: res, u: T`dollars`, tol: 0.01, w: [rnd(price * (1 - (d - tx) / 100), 2), rnd(price * (1 - d / 100), 2), rnd(price * (1 + tx / 100), 2)], s: T`$${price} \times ${M(1 - d / 100)} = ${M(price * (1 - d / 100))}$, then $\times ${M(1 + tx / 100)} = ${M(res)}$ dollars.` }; },
    () => { const G = ri(20, 100), t = pick([1, 2, 2.5, 3, 4, 5]), net = rnd(G * (1 - t / 100), 2); return { q: T`A sack of rice has a gross weight of ${G} kg. The tare is ${F(t)}% of the gross weight. What is the net weight?`, a: net, u: 'kg', w: [rnd((G * t) / 100, 2), G - t, rnd(G * (1 + t / 100), 2)], s: T`Tare $= ${M(t)}\% \times ${G} = ${M(rnd((G * t) / 100, 2))}$ kg. Net $= ${G} - ${M(rnd((G * t) / 100, 2))} = ${M(net)}$ kg.` }; },

{
  id: 'patterns', title: 'Number Patterns & Sequences',
  blurb: 'Arithmetic and geometric patterns, the nth term, and special number sequences.',
  lesson: () => T`
<p>A <b>sequence</b> is an ordered list of numbers called <b>terms</b>. Spotting the rule lets you continue the pattern or jump straight to any term.</p>
<h3>Arithmetic sequences</h3>
<p>The same number $d$ (the <b>common difference</b>) is added each time: 5, 8, 11, 14, … has $d = 3$.</p>
${Key(T`$$u_n = a + (n - 1)d$$<p>where $a$ is the first term. For 5, 8, 11, …: $u_n = 5 + 3(n - 1) = 3n + 2$, so $u_{50} = 152$.</p>`)}
${Fig(planeSvg({ W: 320, H: 230, x: [0, 7], y: [0, 24], step: [1, 4], pts: [1, 2, 3, 4, 5, 6].map(n => [n, 3 * n + 2, String(3 * n + 2), 'end', false, 6, -8]), fns: [{ f: x => 3 * x + 2, cls: 'mf-c2', dash: true, from: 0.5, to: 6.5 }], xl: 'n', yl: 'uₙ', label: T`Terms of 5, 8, 11, … plotted against n: they lie on a straight line` }), T`Terms of an arithmetic sequence lie on a straight line — the common difference 3 is its gradient.`)}
<h3>Geometric sequences</h3>
<p>Each term is multiplied by the same <b>ratio</b> $r$: 3, 6, 12, 24, … ($r = 2$); 80, 40, 20, … ($r = \frac{1}{2}$).</p>
${FigRow([1, 2, 3, 4].map(n => [gridSvg(n, n, (r, c) => c <= r ? 'mf-s1' : null, { dots: true, cell: 18, label: T`Triangle of dots` }), String(n * (n + 1) / 2)]), T`Triangular numbers 1, 3, 6, 10: each new row adds one more dot than the last.`)}
<h3>Special sequences</h3>
${Tbl([T`Name`, T`Terms`, T`nth term`], [[T`Square numbers`, [1, 4, 9, 16, 25, '…'].join(LS()), T`$n^2$`], [T`Cube numbers`, [1, 8, 27, 64, '…'].join(LS()), T`$n^3$`], [T`Triangular numbers`, [1, 3, 6, 10, 15, '…'].join(LS()), T`$\frac{n(n+1)}{2}$`], [T`Fibonacci`, [1, 1, 2, 3, 5, 8, '…'].join(LS()), T`each term = sum of the previous two`]])}
${Ex(T`<p>Which term of 7, 11, 15, … equals 95? $u_n = 4n + 3 = 95$, so $n = 23$: it is the 23rd term.</p>`)}
${Tip(T`<p>The coefficient of $n$ in the nth-term formula is the common difference — not the first term.</p>`)}`,
  gens: [
    () => { const a = rnz(-20, 30), d = rnz(-9, 12), t = range(0, 4).map(i => a + i * d); return { q: T`What is the next term in the sequence ${t.join(LS())}, …?`, a: a + 5 * d, neg: true, w: [a + 6 * d, a + 4 * d + 1, t[4] - d, t[4] * 2], s: T`The common difference is ${d}, so the next term is $${t[4]} ${sg(d)} = ${a + 5 * d}$.` }; },

    () => { const d = ri(2, 9), c = rnz(-9, 9), t = range(1, 4).map(n => d * n + c), L = (p, q) => `$${lin(p, q, 'n')}$`; return { q: T`Which formula gives the nth term of ${t.join(LS())}, …?`, a: L(d, c), w: [L(d, c + d), L(1, d), L(c + d, d), L(d, -c)], s: T`The terms increase by ${d}, so the formula starts $${d}n$. For $n = 1$, $${d}(1) + c = ${t[0]}$ gives $c = ${c}$: $u_n = ${lin(d, c, 'n')}$.` }; },
    () => { const a = ri(1, 5), r = pick([2, 3, -2, -3, 4]), t = range(0, 3).map(i => a * r ** i); return { q: T`What is the next term in the sequence ${t.join(LS())}, …?`, a: a * r ** 4, neg: true, w: [t[3] + (t[3] - t[2]), -a * r ** 4, a * r ** 5], s: T`Each term is multiplied by ${r}, so the next term is $${pn(t[3])} \times ${pn(r)} = ${a * r ** 4}$.` }; },

{
  id: 'similarity', title: 'Transformations & Similarity',
  blurb: 'Translations, reflections, rotations and dilations; similar figures and scale factors.',
  lesson: () => T`
<p>A <b>transformation</b> moves or resizes a shape. Under translations, reflections and rotations the image is <b>congruent</b> (same shape and size); under a dilation it is <b>similar</b> (same shape, different size).</p>
${Tbl([T`Transformation`, T`Rule for a point (x, y)`], [[T`Translation by $\binom{a}{b}$`, `$(x + a${LS().trim()}\\; y + b)$`], [T`Reflection in the $x$-axis`, `$(x${LS().trim()}\\; -y)$`], [T`Reflection in the $y$-axis`, `$(-x${LS().trim()}\\; y)$`], [T`Reflection in $y = x$`, `$(y${LS().trim()}\\; x)$`], [T`Rotation $90^\circ$ anticlockwise about O`, `$(-y${LS().trim()}\\; x)$`], [T`Rotation $180^\circ$ about O`, `$(-x${LS().trim()}\\; -y)$`], [T`Rotation $90^\circ$ clockwise about O`, `$(y${LS().trim()}\\; -x)$`], [T`Dilation, scale factor $k$, centre O`, `$(kx${LS().trim()}\\; ky)$`]])}
${Fig(planeSvg({ W: 360, x: [-6, 6], y: [-5, 5], equal: true, polys: [{ pts: [[1, 1], [4, 1], [1, 3]], cls: 'mf-f1' }, { pts: [[-1, 1], [-4, 1], [-1, 3]], cls: 'mf-f2' }, { pts: [[-1, -1], [-4, -1], [-1, -3]], cls: 'mf-f3' }, { pts: [[2, -2], [5, -2], [2, 0]], cls: 'mf-f4' }], texts: [[2, 1.6, 'P', 'middle', 'mf-lab-b'], [-2, 1.6, T`reflect`, 'middle', 'mf-small'], [-2, -1.6, T`rotate 180°`, 'middle', 'mf-small'], [3, -1.4, T`translate`, 'middle', 'mf-small']], label: T`Triangle P with its reflection in the y-axis, rotation by 180 degrees and a translation` }), T`Triangle P and three congruent images: reflected in the $y$-axis, rotated $180^\circ$ about the origin, and translated by $\binom{1}{-3}$.`)}

{
  id: 'functions', title: 'Functions, Composition & Inverses',
  blurb: 'Domain and range, composite functions, inverse functions and piecewise definitions.',
  lesson: () => T`
<p>A <b>function</b> assigns to each input exactly <b>one</b> output. The set of allowed inputs is the <b>domain</b>; the set of outputs is the <b>range</b>.</p>
${FigRow([[mappingSvg(['1', '2', '3'], ['3', '5', '7'], [[0, 0], [1, 1], [2, 2]], T`Mapping diagram of a function`), T`Function: each input has one output`], [mappingSvg(['1', '2', '3'], ['a', 'b', 'c'], [[0, 0], [0, 1], [1, 1], [2, 2]], T`Mapping diagram that is not a function`), T`Not a function: 1 has two outputs`]])}
<h3>Natural domains</h3>
<ul><li>No division by zero: for $\frac{1}{x - 2}$, the domain is $x \ne 2$.</li><li>No square roots of negatives: for $\sqrt{x + 3}$, the domain is $x \ge -3$.</li><li>Logarithms need positive arguments: for $\log(x - 1)$, the domain is $x \gt 1$.</li></ul>
<h3>Composition</h3>
${Key(T`$$(f \circ g)(x) = f(g(x))$$<p>Apply $g$ first, then $f$. In general $f \circ g \ne g \circ f$.</p>`)}
${Ex(T`<p>$f(x) = 2x + 1$, $g(x) = x^2$. Then $f(g(3)) = f(9) = 19$, but $g(f(3)) = g(7) = 49$. As expressions: $f(g(x)) = 2x^2 + 1$ and $g(f(x)) = (2x + 1)^2$.</p>`)}
<h3>Inverse functions</h3>
<p>$f^{-1}$ undoes $f$: if $f(a) = b$ then $f^{-1}(b) = a$. To find it, write $y = f(x)$, swap $x$ and $y$, and solve for $y$.</p>
${Ex(T`<p>$f(x) = 3x - 5$: swap to get $x = 3y - 5$, so $y = \frac{x + 5}{3}$ and $f^{-1}(x) = \frac{x + 5}{3}$. Check: $f(f^{-1}(x)) = x$ ✓</p>`)}
${Fig(planeSvg({ W: 320, x: [-6, 6], y: [-6, 6], equal: true, step: [2, 2], fns: [{ f: x => x, cls: 'mf-grid', dash: true, label: 'y = x', at: 5.9, dx: -4, dy: 16, anchor: 'end' }, { f: x => 3 * x - 5, label: 'f', at: 3.3, dx: 8, dy: 4 }, { f: x => (x + 5) / 3, cls: 'mf-c2', label: 'f⁻¹', at: 5, dx: -4, dy: -10, anchor: 'end' }], pts: [[2, 1, cP(2, 1), 'start', false, 8, 14], [1, 2, cP(1, 2), 'end', false, 8, -6]], segs: [[2, 1, 1, 2, 'mf-c4', true]], label: T`Graphs of f(x) = 3x − 5 and its inverse, mirror images in the line y = x` }), T`$f$ and $f^{-1}$ are mirror images in $y = x$: the point $(2, 1)$ on $f$ becomes $(1, 2)$ on $f^{-1}$.`)}
<p>The graph of $f^{-1}$ is the reflection of the graph of $f$ in the line $y = x$. Only one-to-one functions have inverses.</p>
${Tip(T`<p>$f^{-1}(x)$ means the inverse function, not $\frac{1}{f(x)}$.</p>`)}`,

{
  id: 'exp-log', title: 'Exponents & Logarithms',
  blurb: 'Rational exponents, logarithm laws, exponential and logarithmic equations, growth.',
  lesson: () => T`
<p>Rational exponents combine powers and roots: $a^{\frac{m}{n}} = \left(\sqrt[n]{a}\right)^m$. So $8^{\frac{2}{3}} = (\sqrt[3]{8})^2 = 4$ and $16^{-\frac{1}{2}} = \frac{1}{4}$.</p>
<h3>Logarithms</h3>
${Key(T`$$\log_b a = c \quad\Longleftrightarrow\quad b^c = a \qquad (b \gt 0,\; b \ne 1,\; a \gt 0)$$<p>A logarithm answers "what power of $b$ gives $a$?" — so $\log_2 32 = 5$. $\log x$ means $\log_{10} x$; $\ln x$ means $\log_e x$ with $e \approx 2.718$.</p>`)}
${Tbl([T`Law`, T`Example`], [[T`$\log_b(xy) = \log_b x + \log_b y$`, T`$\log_6 4 + \log_6 9 = \log_6 36 = 2$`], [T`$\log_b\!\left(\frac{x}{y}\right) = \log_b x - \log_b y$`, T`$\log_3 54 - \log_3 2 = \log_3 27 = 3$`], [T`$\log_b(x^n) = n \log_b x$`, T`$\log 1000 = 3 \log 10 = 3$`], [T`$\log_b x = \dfrac{\log x}{\log b}$`, T`change of base`], [T`$\log_b 1 = 0,\; \log_b b = 1$`, '']])}
${Fig(planeSvg({ W: 320, x: [-4, 8], y: [-4, 8], equal: true, step: [1, 1], tickX: 2, tickY: 2, fns: [{ f: x => x, cls: 'mf-grid', dash: true }, { f: x => 2 ** x, label: 'y = 2ˣ', at: 2.6, dx: -8, dy: 0, anchor: 'end' }, { f: x => Math.log2(x), cls: 'mf-c2', from: 0.01 }], pts: [[0, 1], [1, 0], [3, 8], [8, 3]], texts: [[5.5, 0.9, 'y = log₂ x']], label: T`Graphs of y = 2 to the x and y = log base 2 of x, reflections in y = x` }), T`$y = \log_2 x$ is the reflection of $y = 2^x$ in $y = x$: it passes through $(1, 0)$ because $2^0 = 1$, and is only defined for $x \gt 0$.`)}
<h3>Solving equations</h3>
<ul><li>Same base: $2^{x+1} = 32 = 2^5 \Rightarrow x + 1 = 5 \Rightarrow x = 4$.</li><li>Log equation: $\log_3(2x - 1) = 2 \Rightarrow 2x - 1 = 3^2 = 9 \Rightarrow x = 5$.</li><li>Different bases: take logs of both sides, $5^x = 20 \Rightarrow x = \frac{\log 20}{\log 5} \approx 1.861$.</li></ul>
<h3>Exponential growth and decay</h3>
<p>$A = A_0 \cdot r^{t/T}$: a quantity multiplied by $r$ every $T$ time units. Compound interest: $A = P(1 + i)^n$.</p>
${Fig(planeSvg({ W: 340, x: [0, 22], y: [0, 110], step: [5, 25], fns: [{ f: t => 100 * 0.5 ** (t / 5) }], pts: [[0, 100, '100'], [5, 50, '50'], [10, 25, '25'], [15, 12.5, F(12.5)]], xl: T`years`, yl: 'A', label: T`Exponential decay halving every 5 years: 100, 50, 25, 12.5` }), T`Decay with $r = \frac{1}{2}$ and $T = 5$: $A = 100 \cdot \left(\frac{1}{2}\right)^{t/5}$ halves every 5 years (a half-life).`)}
${Tip(T`<p>$\log(x + y) \ne \log x + \log y$. The product law turns a <i>product</i> inside into a sum outside.</p>`)}`,

{
  id: 'sequences', title: 'Sequences & Series',
  blurb: 'Arithmetic and geometric sequences and series, infinite geometric series and sigma notation.',
  lesson: () => T`
${Tbl(['', T`Arithmetic`, T`Geometric`], [[T`Rule`, T`add $d$ each time`, T`multiply by $r$ each time`], [T`nth term`, T`$u_n = a + (n - 1)d$`, T`$u_n = a r^{n-1}$`], [T`Sum of n terms`, T`$S_n = \frac{n}{2}\big(2a + (n - 1)d\big) = \frac{n}{2}(a + l)$`, T`$S_n = \frac{a(r^n - 1)}{r - 1}$, $r \ne 1$`]])}
<p>Here $a$ is the first term and $l$ the last term.</p>
${Ex(T`<p>The sum of the first 20 terms of $3, 7, 11, \ldots$ is $S_{20} = \frac{20}{2}(2 \cdot 3 + 19 \cdot 4) = 10 \times 82 = 820$.</p>`)}
${Ex(T`<p>In an arithmetic sequence $u_4 = 17$ and $u_9 = 42$. Five steps of $d$ separate them, so $5d = 25$, $d = 5$, and $a = 17 - 3 \times 5 = 2$.</p>`)}
<h3>Infinite geometric series</h3>
${Key(T`<p>If $|r| \lt 1$ the terms shrink fast enough for the sum to settle on a finite value:</p>$$S_\infty = \frac{a}{1 - r}$$<p>If $|r| \ge 1$ the series has no finite sum.</p>`)}
<p>Example: $8 + 4 + 2 + 1 + \cdots = \frac{8}{1 - \frac{1}{2}} = 16$.</p>
${Fig(halvingSquareSvg(), T`$\frac{1}{2} + \frac{1}{4} + \frac{1}{8} + \cdots$ keeps filling half of what is left, so it never passes 1 — the sum to infinity is exactly $\frac{1/2}{1 - 1/2} = 1$.`)}
<h3>Sigma notation</h3>
<p>$\displaystyle\sum_{k=1}^{n} f(k)$ means $f(1) + f(2) + \cdots + f(n)$. Useful facts: $\sum_{k=1}^{n} k = \frac{n(n+1)}{2}$ and $\sum_{k=1}^{n} c = cn$.</p>
${Tip(T`<p>Between $u_p$ and $u_q$ there are $q - p$ steps, not $q - p + 1$.</p>`)}`,

  lesson: () => T`
<p>In a right triangle, relative to an acute angle $\theta$:</p>
${Fm(T`\sin\theta = \frac{\text{opposite}}{\text{hypotenuse}} \qquad \cos\theta = \frac{\text{adjacent}}{\text{hypotenuse}} \qquad \tan\theta = \frac{\text{opposite}}{\text{adjacent}}`)}
${Fig(triangleSvg([[40, 180], [300, 180], [300, 40]], { right: 1, sides: [T`adjacent`, T`opposite`, T`hypotenuse`], angles: ['θ'], W: 380, H: 216, label: T`Right triangle with angle theta: adjacent side along the bottom, opposite side vertical, hypotenuse slanted` }), T`Names depend on the angle: the opposite side faces $\theta$, the adjacent side touches it, the hypotenuse faces the right angle.`)}
<p>Memory aid: <b>SOH-CAH-TOA</b>. Also $\tan\theta = \frac{\sin\theta}{\cos\theta}$, and the reciprocals are $\csc\theta = \frac{1}{\sin\theta}$, $\sec\theta = \frac{1}{\cos\theta}$, $\cot\theta = \frac{1}{\tan\theta}$.</p>
<h3>Exact values</h3>
${Tbl(['θ', '0°', '30°', '45°', '60°', '90°'], [[T`sin θ`, '0', T`$\frac{1}{2}$`, T`$\frac{\sqrt{2}}{2}$`, T`$\frac{\sqrt{3}}{2}$`, '1'], [T`cos θ`, '1', T`$\frac{\sqrt{3}}{2}$`, T`$\frac{\sqrt{2}}{2}$`, T`$\frac{1}{2}$`, '0'], [T`tan θ`, '0', T`$\frac{\sqrt{3}}{3}$`, '1', T`$\sqrt{3}$`, T`undefined`]])}
${FigRow([[triangleSvg([[20, 150], [200, 150], [200, 46]], { right: 1, sides: ['√3', '1', '2'], angles: ['30°', '', '60°'], W: 240, H: 180, label: T`30-60-90 triangle with sides 1, root 3 and 2` }), '30°–60°–90°'], [triangleSvg([[30, 160], [160, 160], [160, 30]], { right: 1, sides: ['1', '1', '√2'], angles: ['45°', '', '45°'], W: 220, H: 190, label: T`45-45-90 triangle with sides 1, 1 and root 2` }), '45°–45°–90°']], T`The exact values come from these two triangles (half a square and half an equilateral triangle).`)}
<h3>Radians</h3>
<p>$180^\circ = \pi$ radians. To convert degrees to radians multiply by $\frac{\pi}{180}$; radians to degrees multiply by $\frac{180}{\pi}$. So $60^\circ = \frac{\pi}{3}$ and $\frac{3\pi}{4} = 135^\circ$.</p>
<h3>The unit circle</h3>
${Key(T`<p>For any angle $\theta$, the point on the unit circle is $(\cos\theta, \sin\theta)$. Signs by quadrant — "<b>A</b>ll <b>S</b>tudents <b>T</b>ake <b>C</b>alculus": all positive in I, sin in II, tan in III, cos in IV.</p><p>Use the <b>reference angle</b> (the acute angle to the $x$-axis) plus the correct sign: $\sin 150^\circ = +\sin 30^\circ = \frac{1}{2}$, $\cos 240^\circ = -\cos 60^\circ = -\frac{1}{2}$.</p>`)}

${Ex(T`<p>From 30 m away, the angle of elevation to the top of a tower is $60^\circ$. Height $= 30 \tan 60^\circ = 30\sqrt{3} \approx 52.0$ m.</p>`)}

${FigW(planeSvg({ W: 560, H: 220, x: [0, 380], y: [-1.3, 1.3], step: [90, 0.5], tickX: 90, fmtX: v => v + '°', fns: [{ f: x => Math.sin(x * Math.PI / 180), label: 'sin x', at: 90, dx: 0, dy: -10, anchor: 'middle' }, { f: x => Math.cos(x * Math.PI / 180), cls: 'mf-c2', label: 'cos x', at: 0, dx: 8, dy: -8 }], label: T`Graphs of sin x and cos x from 0 to 360 degrees` }), T`$\sin x$ and $\cos x$ are the same wave shifted by $90^\circ$; both repeat every $360^\circ$ and stay between $-1$ and 1.`)}

  id: 'polynomials', title: 'Polynomials & the Remainder Theorem',
  blurb: 'Degree and operations, polynomial division, the remainder and factor theorems, Vieta for cubics.',
  lesson: () => T`
<p>A <b>polynomial</b> is a sum of terms $a_n x^n + \cdots + a_1 x + a_0$ with whole-number powers. Its <b>degree</b> is the highest power; $a_n$ is the <b>leading coefficient</b>. When multiplying polynomials, degrees add and leading coefficients multiply.</p>
<h3>Division</h3>
<p>Dividing $P(x)$ by $(x - a)$ gives a quotient $Q(x)$ and a remainder $R$: $P(x) = (x - a)Q(x) + R$. <b>Synthetic division</b> is a quick way to do it using only the coefficients.</p>
${Ex(T`<p>$(x^3 - 4x^2 + x + 6) \div (x - 2)$ with synthetic division:</p>${Tbl(['2', '1', '−4', '1', '6'], [['', '', '2', '−4', '−6'], ['', '1', '−2', '−3', '0']])}<p>Quotient $x^2 - 2x - 3$, remainder 0.</p>`)}
${Key(T`<p><b>Remainder theorem:</b> the remainder when $P(x)$ is divided by $(x - a)$ is $P(a)$.</p><p><b>Factor theorem:</b> $(x - a)$ is a factor of $P(x)$ exactly when $P(a) = 0$.</p>`)}
${Fig(planeSvg({ W: 340, x: [-2, 4], y: [-8, 8], step: [1, 2], fns: [{ f: x => x ** 3 - 4 * x * x + x + 6, label: 'P(x)', at: 3.6, dx: 8, dy: 0 }], pts: [[-1, 0], [2, 0], [3, 0]], label: T`Graph of the cubic x³ − 4x² + x + 6 crossing the x-axis at −1, 2 and 3` }), T`$P(x) = x^3 - 4x^2 + x + 6 = (x + 1)(x - 2)(x - 3)$: each factor $(x - a)$ gives a root where the curve crosses the axis.`)}
<h3>Roots of a cubic</h3>
<p>For $ax^3 + bx^2 + cx + d = 0$ with roots $r_1, r_2, r_3$:</p>
${Fm(T`r_1 + r_2 + r_3 = -\frac{b}{a} \qquad r_1r_2 + r_1r_3 + r_2r_3 = \frac{c}{a} \qquad r_1r_2r_3 = -\frac{d}{a}`)}

  id: 'matrices', title: 'Matrices',
  blurb: 'Matrix operations, multiplication, determinants and inverses of 2×2 matrices.',
  lesson: () => T`
<p>A <b>matrix</b> is a rectangular array of numbers. An $m \times n$ matrix has $m$ rows and $n$ columns; $a_{ij}$ is the entry in row $i$, column $j$.</p>
<h3>Operations</h3>
<ul><li><b>Add/subtract</b> entry by entry (same size only).</li><li><b>Scalar multiple</b>: multiply every entry.</li><li><b>Multiply</b> $AB$: entry $(i, j)$ is row $i$ of $A$ dotted with column $j$ of $B$. It needs (columns of $A$) = (rows of $B$), and an $m \times n$ times $n \times p$ gives $m \times p$.</li></ul>
${Fm(T`\begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}\begin{pmatrix} 5 & 6 \\ 7 & 8 \end{pmatrix} = \begin{pmatrix} 1\cdot5 + 2\cdot7 & 1\cdot6 + 2\cdot8 \\ 3\cdot5 + 4\cdot7 & 3\cdot6 + 4\cdot8 \end{pmatrix} = \begin{pmatrix} 19 & 22 \\ 43 & 50 \end{pmatrix}`)}
${Key(T`<p>Matrix multiplication is <b>not commutative</b>: usually $AB \ne BA$.</p>`)}
<h3>Determinant and inverse (2 × 2)</h3>
${Fm(T`A = \begin{pmatrix} a & b \\ c & d \end{pmatrix} \qquad \det A = ad - bc \qquad A^{-1} = \frac{1}{ad - bc}\begin{pmatrix} d & -b \\ -c & a \end{pmatrix}`)}
<p>If $\det A = 0$ the matrix is <b>singular</b> and has no inverse. Inverses solve systems: $AX = B \Rightarrow X = A^{-1}B$.</p>
${Fig(planeSvg({ W: 320, x: [-1, 4], y: [-1, 3], equal: true, polys: [{ pts: [[0, 0], [1, 0], [1, 1], [0, 1]], cls: 'mf-f1' }, { pts: [[0, 0], [2, 0], [3, 1], [1, 1]], cls: 'mf-f2' }], vecs: [[0, 0, 2, 0, 'mf-c2'], [0, 0, 1, 1, 'mf-c2']], texts: [[0.5, 0.45, T`area 1`, 'middle', 'mf-small'], [2.1, 0.45, T`area 2`, 'middle', 'mf-small']], label: T`The matrix with rows (2, 1) and (0, 1) maps the unit square to a parallelogram of area 2` }), T`$\begin{pmatrix} 2 & 1 \\ 0 & 1 \end{pmatrix}$ sends the unit square to a parallelogram. Its determinant, 2, is the area scale factor.`)}
${Tip(T`<p>For the inverse: <b>swap</b> $a$ and $d$, <b>negate</b> $b$ and $c$, then divide by the determinant.</p>`)}`,

{
  id: 'limits', title: 'Limits',
  blurb: 'Direct substitution, indeterminate forms, limits at infinity, trig limits and continuity.',
  lesson: () => T`
<p>$\displaystyle\lim_{x \to a} f(x) = L$ means $f(x)$ gets as close as we like to $L$ as $x$ approaches $a$ — whatever happens exactly at $x = a$.</p>
<h3>Techniques</h3>
<ol><li><b>Direct substitution</b> works for polynomials and other continuous functions: $\lim_{x \to 2}(x^2 + 3x) = 10$.</li><li><b>Factor and cancel</b> for $\frac{0}{0}$: $\displaystyle\lim_{x \to 3}\frac{x^2 - 9}{x - 3} = \lim_{x \to 3}(x + 3) = 6$.</li><li><b>Rationalise</b> expressions with roots: multiply by the conjugate.</li></ol>
${Ex(T`$$\lim_{x \to 0}\frac{\sqrt{x + 4} - 2}{x} = \lim_{x \to 0}\frac{(x + 4) - 4}{x(\sqrt{x + 4} + 2)} = \lim_{x \to 0}\frac{1}{\sqrt{x + 4} + 2} = \frac{1}{4}$$`)}
${Fig(planeSvg({ W: 320, x: [-1, 5], y: [-1, 7], equal: true, fns: [{ f: x => x + 2 }], texts: [[2.2, 1.6, 'y = (x² − 4)/(x − 2)', 'start']], pts: [[2, 4, T`hole at (2, 4)`, 'start', true, 10, 14]], label: T`Graph of (x² − 4)/(x − 2): the line y = x + 2 with a hole at (2, 4)` }), T`$\frac{x^2 - 4}{x - 2}$ equals $x + 2$ except at $x = 2$, where there is a hole. The limit is still 4.`)}
<h3>Limits at infinity</h3>
${Key(T`<p>For a rational function, divide top and bottom by the highest power of $x$ in the denominator:</p><ul><li>same degree → ratio of leading coefficients;</li><li>numerator of lower degree → 0;</li><li>numerator of higher degree → no finite limit ($\pm\infty$).</li></ul>`)}
${Fig(planeSvg({ W: 340, x: [-4, 12], y: [-3, 6], step: [2, 1], tickY: 2, fns: [{ f: x => (2 * x + 1) / (x - 1), cls: 'mf-c1', from: -4, to: 0.97 }, { f: x => (2 * x + 1) / (x - 1), cls: 'mf-c1', from: 1.03, label: 'y = (2x + 1)/(x − 1)', at: 6, dx: 0, dy: -30, anchor: 'middle' }, { f: () => 2, cls: 'mf-c2', dash: true, label: 'y = 2', at: 11, dx: 0, dy: 16, anchor: 'end' }], segs: [[1, -3, 1, 6, 'mf-grid', true]], label: T`Rational function approaching the horizontal asymptote y = 2` }), T`Same degree on top and bottom: as $x \to \pm\infty$, $\frac{2x + 1}{x - 1} \to \frac{2}{1} = 2$, the horizontal asymptote.`)}
<h3>A special trig limit</h3>
${Fm(T`\lim_{x \to 0}\frac{\sin x}{x} = 1 \qquad\Longrightarrow\qquad \lim_{x \to 0}\frac{\sin ax}{bx} = \frac{a}{b}`)}
<h3>Continuity</h3>
<p>$f$ is continuous at $a$ if $\lim_{x \to a} f(x) = f(a)$: no holes, jumps or asymptotes there. For a piecewise function, make the two pieces meet at the join.</p>
${Tip(T`<p>$\frac{0}{0}$ is not "0" or "undefined" — it signals that more work (factoring, rationalising) is needed.</p>`)}`,
  gens: [

{
  id: 'derivatives', title: 'Derivatives',
  blurb: 'The derivative as a slope, the power rule, tangent lines, stationary points and optimisation.',
  lesson: () => T`
<p>The <b>derivative</b> $f'(x)$ is the instantaneous rate of change of $f$ — the slope of the tangent line at $x$. It is defined by a limit:</p>
${Fm(T`f'(x) = \lim_{h \to 0}\frac{f(x + h) - f(x)}{h}`)}
${Fig(planeSvg({ W: 340, x: [-1, 3.5], y: [-1, 9], step: [1, 1], tickY: 2, fns: [{ f: x => x * x, label: 'y = x²', at: 2.9, dx: -8, dy: 0, anchor: 'end' }, { f: x => 4 * x - 3, cls: 'mf-c3', dash: true, from: 0.3, to: 3.2 }, { f: x => 3 * x - 2, cls: 'mf-c4', dash: true, from: 0.2, to: 2.8 }, { f: x => 2 * x - 1, cls: 'mf-c2', from: -0.2, to: 3.2 }], texts: [[2.6, 0.6, T`tangent, slope 2`, 'middle', 'mf-small']], pts: [[1, 1, 'P', 'end', false, 8, -6], [3, 9], [2, 4]], label: T`Secant lines from P(1, 1) with h = 2 and h = 1 approaching the tangent of slope 2` }), T`As $h \to 0$ the secant slopes ($4$, then $3$, …) approach the tangent slope $f'(1) = 2$.`)}
${Key(T`$$\frac{d}{dx}x^n = nx^{n-1} \qquad \frac{d}{dx}c = 0 \qquad \frac{d}{dx}\big(af + bg\big) = af' + bg'$$$$\frac{d}{dx}\sin x = \cos x \qquad \frac{d}{dx}\cos x = -\sin x$$`, T`Rules`)}
${Ex(T`<p>$f(x) = 2x^3 - 5x^2 + 4x - 7 \;\Rightarrow\; f'(x) = 6x^2 - 10x + 4$.</p>`)}
<h3>Tangent lines</h3>
<p>At $x = a$, the tangent has slope $m = f'(a)$ and passes through $(a, f(a))$: $y - f(a) = f'(a)(x - a)$.</p>
<h3>Stationary points</h3>
<p>Where $f'(x) = 0$ the graph is momentarily flat. Use the second derivative: $f''(a) \gt 0$ → local minimum; $f''(a) \lt 0$ → local maximum. $f$ is increasing where $f' \gt 0$ and decreasing where $f' \lt 0$.</p>
${Fig(planeSvg({ W: 320, x: [-2.5, 2.5], y: [-3, 3], step: [1, 1], fns: [{ f: x => x ** 3 - 3 * x }], segs: [[-1.6, 2, -0.4, 2, 'mf-c2'], [0.4, -2, 1.6, -2, 'mf-c2']], pts: [[-1, 2, T`max`, 'middle', false, 0, -10], [1, -2, T`min`, 'middle', false, 0, 20]], label: T`Cubic y = x³ − 3x with a local maximum at (−1, 2) and a local minimum at (1, −2), where the tangents are horizontal` }), T`At stationary points the tangent is horizontal ($f'(x) = 3x^2 - 3 = 0$, $x = \pm 1$). $f'' = 6x$ is negative at $-1$ (max) and positive at $1$ (min).`)}
<h3>Optimisation</h3>
${Ex(T`<p>100 m of fencing encloses a rectangle against a river (no fence needed on the river side). With sides $x, y, x$: $2x + y = 100$, area $A = x(100 - 2x)$. $A'(x) = 100 - 4x = 0$ gives $x = 25$, so $A_{\max} = 25 \times 50 = 1250$ m².</p>`)}
${Tip(T`<p>The derivative of a constant is 0 — don't carry the constant term into $f'(x)$.</p>`)}`,
  gens: [
    () => { const c = [rnz(-5, 5), ri(-6, 6), ri(-9, 9), ri(-9, 9)], D = co => `$f'(x) = ${poly(co)}$`; return { q: T`Find $f'(x)$ for $f(x) = ${poly(c)}$.`, a: D([3 * c[0], 2 * c[1], c[2]]), w: [D([c[0], c[1], c[2]]), D([3 * c[0], 2 * c[1], c[2], 0]), D([3 * c[0], 2 * c[1], c[2] + c[3]]), D([3 * c[0], -2 * c[1], c[2]])], s: T`Apply the power rule to each term: $f'(x) = ${poly([3 * c[0], 2 * c[1], c[2]])}$ (the constant disappears).` }; },

{
  id: 'integrals', title: 'Integrals',
  blurb: 'Antiderivatives, the power rule for integration, definite integrals and areas.',
  lesson: () => T`
<p>Integration reverses differentiation. An <b>antiderivative</b> of $f$ is any $F$ with $F' = f$; the <b>indefinite integral</b> includes the constant of integration:</p>
${Key(T`$$\int x^n\,dx = \frac{x^{n+1}}{n + 1} + C \quad (n \ne -1) \qquad \int \frac{1}{x}\,dx = \ln|x| + C$$$$\int \cos x\,dx = \sin x + C \qquad \int \sin x\,dx = -\cos x + C$$`, T`Rules`)}
${Ex(T`<p>$\int (6x^2 - 4x + 3)\,dx = 2x^3 - 2x^2 + 3x + C$. Check by differentiating.</p>`)}
<h3>Definite integrals</h3>
${Key(T`$$\int_a^b f(x)\,dx = \Big[F(x)\Big]_a^b = F(b) - F(a)$$`, T`Fundamental Theorem of Calculus`)}
${Fig(planeSvg({ W: 340, x: [-0.5, 4.5], y: [0, 10], step: [1, 2], shade: [{ f: x => x * x / 2 + 1, from: 0, to: 4, cls: 'mf-f1' }], rects: [0, 1, 2, 3, 4, 5, 6, 7].map(i => [i / 2, 0, 0.5, (i / 2) ** 2 / 2 + 1, 'mf-f2']), fns: [{ f: x => x * x / 2 + 1, label: 'y = f(x)', at: 4, dx: -6, dy: -6, anchor: 'end' }], label: T`Area under a curve approximated by eight rectangles` }), T`The definite integral is the limit of rectangle sums: thinner rectangles fit the area under the curve better and better.`)}
<p>For $f \ge 0$ this is the area under the curve between $x = a$ and $x = b$. Area below the $x$-axis counts as negative, so split the integral at the roots when you want total area.</p>
${Ex(T`<p>Area between $y = x^2$ and $y = 2x$: they meet at $x = 0$ and $x = 2$, and $2x \ge x^2$ in between, so $\int_0^2 (2x - x^2)\,dx = \left[x^2 - \frac{x^3}{3}\right]_0^2 = 4 - \frac{8}{3} = \frac{4}{3}$.</p>`)}
${Fig(planeSvg({ W: 300, x: [-0.5, 2.8], y: [-0.5, 5], equal: true, shade: [{ f: x => 2 * x, g: x => x * x, from: 0, to: 2, cls: 'mf-f1' }], fns: [{ f: x => 2 * x }, { f: x => x * x, cls: 'mf-c2' }], texts: [[1.1, 2.8, 'y = 2x', 'end'], [2.2, 3.2, 'y = x²', 'start']], pts: [[0, 0], [2, 4, cP(2, 4), 'end', false, 8, -4]], label: T`Region between y = 2x and y = x² from 0 to 2` }), T`The shaded area between the curves: $\int_0^2 (\text{top} - \text{bottom})\,dx = \frac{4}{3}$.`)}
<h3>Finding a function from its derivative</h3>
<p>If $f'(x) = 6x + 2$ and $f(1) = 10$, then $f(x) = 3x^2 + 2x + C$ and $3 + 2 + C = 10$ gives $C = 5$.</p>
${Tip(T`<p>Don't forget $+ C$ on indefinite integrals — and don't include it in definite ones (it cancels).</p>`)}`,

{
  id: 'combinatorics', title: 'Counting, Permutations & Combinations',
  blurb: 'The multiplication principle, factorials, permutations, combinations and the binomial theorem.',
  lesson: () => T`
${Key(T`<p><b>Multiplication principle:</b> if one choice can be made in $m$ ways and a second in $n$ ways, together they can be made in $m \times n$ ways.</p>`)}
${Fig(treeSvg([[['S', ''], ['M', ''], ['L', '']], [[[T`tea`, ''], [T`coffee`, '']], [[T`tea`, ''], [T`coffee`, '']], [[T`tea`, ''], [T`coffee`, '']]]], { label: T`Tree diagram: 3 cup sizes then 2 drinks gives 6 outcomes` }), T`3 sizes × 2 drinks = 6 branches: the multiplication principle.`)}
<h3>Permutations: order matters</h3>
${Fm(T`^nP_r = \frac{n!}{(n - r)!} \qquad n! = n \times (n-1) \times \cdots \times 1, \quad 0! = 1`)}
<p>First, second and third prizes among 10 people: $^{10}P_3 = 10 \times 9 \times 8 = 720$.</p>
<ul><li>Arrangements with repeated items: $\frac{n!}{p!\,q!\cdots}$. "BANANA" has $\frac{6!}{3!\,2!} = 60$ arrangements.</li><li>Around a circle: $(n - 1)!$ (rotations are the same).</li></ul>
<h3>Combinations: order doesn't matter</h3>
${Fm(T`^nC_r = \binom{n}{r} = \frac{n!}{r!\,(n - r)!}`)}
<p>A committee of 3 from 10 people: $\binom{10}{3} = 120$. A committee of 2 men (from 5) and 3 women (from 6): $\binom{5}{2}\binom{6}{3} = 10 \times 20 = 200$.</p>
<h3>Binomial theorem</h3>
${Fm(T`(a + b)^n = \sum_{k=0}^{n}\binom{n}{k}a^{n-k}b^k`)}
${Fig(pascalSvg(7, { hl: [[5, 2], [5, 3]], label: T`Pascal's triangle rows 0 to 6` }), T`Pascal's triangle: each number is the sum of the two above it. Row $n$ holds $\binom{n}{0}, \binom{n}{1}, \ldots$ — row 5 gives $1, 5, 10, 10, 5, 1$.`)}
<p>The coefficient of $x^2$ in $(x + 3)^5$ is $\binom{5}{2}3^{3} = 270$.</p>
${Tip(T`<p>Ask "does swapping two chosen items give something different?" If yes, use permutations; if no, combinations.</p>`)}`,

    () => { const n = ri(5, 12), r = pick([2, 3]); return { q: T`In how many ways can ${r === 3 ? T`first, second and third` : T`first and second`} prizes be awarded among ${n} people?`, a: nPr(n, r), w: [nCr(n, r), n ** r, n * r], s: T`Order matters: $^{${n}}P_{${r}} = ${range(0, r - 1).map(i => n - i).join(T` \times `)} = ${nPr(n, r)}$.` }; },
    () => { const n = ri(6, 15), r = ri(2, 5); return { q: T`In how many ways can a committee of ${r} be chosen from ${n} people?`, a: nCr(n, r), w: [nPr(n, r), nCr(n, r - 1), n * r], s: T`Order doesn't matter: $\binom{${n}}{${r}} = \frac{${n}!}{${r}!\,${n - r}!} = ${nCr(n, r)}$.` }; },

{
  id: 'probability-sh', title: 'Probability: Rules & Conditional',
  blurb: 'Addition and multiplication rules, independence, conditional probability and Bayes’ theorem.',
  lesson: () => T`
${Tbl([T`Rule`, T`Formula`], [[T`Complement`, T`$P(A') = 1 - P(A)$`], [T`Addition`, T`$P(A \cup B) = P(A) + P(B) - P(A \cap B)$`], [T`Mutually exclusive`, T`$P(A \cap B) = 0$, so $P(A \cup B) = P(A) + P(B)$`], [T`Independent`, T`$P(A \cap B) = P(A)\,P(B)$`], [T`Conditional`, T`$P(A \mid B) = \dfrac{P(A \cap B)}{P(B)}$`]])}
${Fig(venn2Svg({ shade: ['a', 'ab', 'b'], texts: { ab: 'A ∩ B' }, label: T`Venn diagram with A union B shaded` }), T`$P(A \cup B)$: adding $P(A)$ and $P(B)$ counts the overlap twice, so subtract $P(A \cap B)$ once.`)}
<h3>With and without replacement</h3>
${Ex(T`<p>A bag has 5 red and 3 blue balls. Two are drawn <b>without</b> replacement. $P(\text{both red}) = \frac{5}{8} \times \frac{4}{7} = \frac{5}{14}$. With replacement it would be $\frac{5}{8} \times \frac{5}{8} = \frac{25}{64}$.</p>`)}
<p>Tree diagrams organise these: multiply along branches, add across branches.</p>
${Fig(treeSvg([[[T`R`, '5/8'], [T`B`, '3/8']], [[[T`R`, '4/7'], [T`B`, '3/7']], [[T`R`, '5/7'], [T`B`, '2/7']]]], { leaf: [['20/56', '15/56'], ['15/56', '6/56']], label: T`Tree diagram for drawing two balls without replacement from 5 red and 3 blue` }), T`Without replacement the second-draw probabilities change. Multiply along each path; the four results add to 1.`)}
<h3>"At least one"</h3>
<p>Use the complement: $P(\text{at least one six in 3 rolls}) = 1 - \left(\frac{5}{6}\right)^3 = \frac{91}{216}$.</p>
<h3>Bayes' theorem</h3>
${Key(T`$$P(A \mid B) = \frac{P(B \mid A)\,P(A)}{P(B \mid A)P(A) + P(B \mid A')P(A')}$$<p>It "reverses" a conditional probability — for example, from $P(\text{positive test} \mid \text{disease})$ to $P(\text{disease} \mid \text{positive test})$.</p>`)}
${Tip(T`<p>$P(A \mid B)$ and $P(B \mid A)$ are usually different. A test can be 99% accurate and a positive result can still be more likely to be a false alarm when the condition is rare.</p>`)}`,

  id: 'statistics-sh', title: 'Statistics: Spread & Distributions',
  blurb: 'Quartiles and IQR, outliers, variance and standard deviation, grouped data and transformations.',
  lesson: () => T`
<h3>Quartiles and box plots</h3>
<p>Sort the data. The median $Q_2$ splits it in half; $Q_1$ is the median of the lower half and $Q_3$ the median of the upper half (here we leave the median out of both halves when $n$ is odd). The <b>interquartile range</b> $\text{IQR} = Q_3 - Q_1$ measures the spread of the middle 50%.</p>
${Fig(boxPlotSvg([2, 4, 4.5, 6, 9], { lo: 0, hi: 10, label: T`Box plot of 2, 4, 4, 4, 5, 5, 7, 9: minimum 2, Q1 4, median 4.5, Q3 6, maximum 9` }), T`Box plot of 2, 4, 4, 4, 5, 5, 7, 9. The box spans the middle half (IQR $= 6 - 4 = 2$); the whiskers reach the extremes.`)}
${Key(T`<p>A common outlier rule: values below $Q_1 - 1.5\,\text{IQR}$ or above $Q_3 + 1.5\,\text{IQR}$.</p>`)}
<h3>Variance and standard deviation</h3>
${Fm(T`\sigma^2 = \frac{\sum (x - \mu)^2}{n} \qquad \sigma = \sqrt{\sigma^2} \qquad\qquad s^2 = \frac{\sum (x - \bar{x})^2}{n - 1} \text{ (sample)}`)}
${Ex(T`<p>Data 2, 4, 4, 4, 5, 5, 7, 9: mean 5, squared deviations 9, 1, 1, 1, 0, 0, 4, 16 (sum 32). Population variance $= \frac{32}{8} = 4$ and $\sigma = 2$.</p>`)}
${FigW(planeSvg({ W: 540, H: 230, x: [-3.6, 3.6], y: [0, 0.45], step: [1, 0.1], grid: false, fmtX: x => x === 0 ? 'μ' : `μ${x > 0 ? '+' : '−'}${Math.abs(x) === 1 ? '' : Math.abs(x)}σ`, fmtY: () => '', xl: ' ', yl: ' ', shade: [{ f: normPdf, from: -2, to: 2, cls: 'mf-f2' }, { f: normPdf, from: -1, to: 1, cls: 'mf-f1' }], fns: [{ f: normPdf }], texts: [[0, 0.15, '68%', 'middle', 'mf-lab-b'], [0, 0.03, '95%', 'middle', 'mf-small'], [2.6, 0.12, F(99.7) + '% ±3σ', 'middle', 'mf-small']], label: T`Normal curve: about 68 percent within one standard deviation and 95 percent within two` }), T`For bell-shaped (normal) data about 68% lies within $1\sigma$ of the mean, 95% within $2\sigma$ and 99.7% within $3\sigma$.`)}
<h3>Grouped data</h3>
<p>Estimate the mean with class midpoints: $\bar{x} \approx \frac{\sum f m}{\sum f}$.</p>
${Fig(barsSvg([['0', 3], ['10', 7], ['20', 12], ['30', 8], ['40', 4, undefined, '50']], { hist: true, W: 380, H: 220, yl: T`frequency`, label: T`Histogram of grouped data with classes 0–10 up to 40–50` }), T`A histogram of grouped data: bars touch because the classes are continuous. Midpoints 5, 15, 25, … estimate the mean.`)}
<h3>Transforming data</h3>
${Tbl([T`If every value becomes`, T`Mean becomes`, T`Standard deviation becomes`], [[T`$x + b$`, T`$\mu + b$`, T`$\sigma$ (unchanged)`], [T`$ax$`, T`$a\mu$`, T`$|a|\sigma$`], [T`$ax + b$`, T`$a\mu + b$`, T`$|a|\sigma$`]])}
${Tip(T`<p>Adding a constant shifts the data but does not spread it out, so the standard deviation stays the same.</p>`)}`,
  gens: [
    () => { const n = 5, m = ri(10, 40), dev = range(1, 4).map(() => ri(-8, 8)); dev.push(-sum(dev)); const data = shuffle(dev.map(d => m + d)), vr = sum(dev.map(d => d * d)) / n, isS = chance(0.35), v2 = isS ? sum(dev.map(d => d * d)) / (n - 1) : vr; return { q: isS ? T`Find the <b>sample</b> variance of: ${data.join(LS())}.` : T`Find the <b>population</b> variance of: ${data.join(LS())}.`, a: v2, w: [isS ? vr :sum(dev.map(d => d * d)) / (n - 1), rnd(Math.sqrt(v2), 2), sum(dev.map(d => d * d))], s: T`Mean $= ${m}$. Squared deviations: ${dev.map(d => d * d).join(LS())} (sum ${sum(dev.map(d => d * d))}). Divide by ${isS ?'n − 1 = 4' : 'n = 5'}: $${M(v2)}$.` }; },
    () => { const n = 5, m = ri(10, 40), dev = range(1, 4).map(() => ri(-8, 8)); dev.push(-sum(dev)); const data = shuffle(dev.map(d => m + d)), sd = rnd(Math.sqrt(sum(dev.map(d => d * d)) / n), 2); return { q: T`Find the population standard deviation of: ${data.join(LS())}. Round to 2 decimal places.`, a: sd, tol: 0.011, w: [rnd(sum(dev.map(d => d * d)) / n, 2), rnd(Math.sqrt(sum(dev.map(d => d * d)) / (n - 1)), 2), rnd(sd + 1, 2)], s: T`Mean $= ${m}$; $\sigma^2 = \frac{${sum(dev.map(d => d * d))}}{5} = ${M(sum(dev.map(d => d * d)) / 5)}$, so $\sigma = \sqrt{${M(sum(dev.map(d => d * d)) / 5)}} \approx ${M(sd)}$.` }; },
    () => { const n = pick([7, 11]), data = sample(range(1, 60), n), s = data.slice().sort((a, b) => a - b), h = (n - 1) / 2, lower = s.slice(0, h), upper = s.slice(h + 1), Q1 = median(lower), Q3 = median(upper); return { q: T`Find the interquartile range of: ${data.join(LS())}. (Exclude the median when splitting the data into halves.)`, a: Q3 - Q1, w: [s[n - 1] - s[0], Q3 - s[h], s[h] - Q1], s: T`Sorted: ${s.join(LS())}. Lower half ${lower.join(LS())} gives $Q_1 = ${Q1}$; upper half ${upper.join(LS())} gives $Q_3 = ${Q3}$. $\text{IQR} = ${Q3} - ${Q1} = ${Q3 - Q1}$.` }; },
    () => { const mu = ri(20, 80), sd = ri(2, 12), a = pick([2, 3, -2, 0.5, 1]), b = rnz(-20, 20), askSd = chance(); return askSd ? { q: T`A data set has mean ${mu} and standard deviation ${sd}. Every value is transformed by $y = ${M(a)}x ${sg(b)}$. What is the new standard deviation?`, a: Math.abs(a) * sd, w: [a * sd + b, sd, Math.abs(a) * sd + Math.abs(b)].filter(x => x >= 0), s: T`Adding ${b} doesn't change the spread; multiplying by ${M(a)} scales it by $|${M(a)}|$: $${M(Math.abs(a))} \times ${sd} = ${M(Math.abs(a) * sd)}$.` } : { q: T`A data set has mean ${mu} and standard deviation ${sd}. Every value is transformed by $y = ${M(a)}x ${sg(b)}$. What is the new mean?`, a: a * mu + b, neg: true, w: [a * mu, mu + b, a * (mu + b)], s: T`The mean follows the transformation: $${M(a)}(${mu}) ${sg(b)} = ${M(a * mu + b)}$.` }; },
    () => { const w = pick([10, 20]), start = ri(0, 3) * w, fs = range(1, 4).map(() => ri(2, 15)), mids = fs.map((_, i) => start + i * w + w / 2), N = sum(fs), S = sum(fs.map((f, i) => f * mids[i])), m = rnd(S / N, 2), classes = fs.map((_, i) => `${start + i * w}–${start + (i + 1) * w}`); return { q: T`Estimate the mean from this grouped frequency table (use class midpoints). Round to 2 decimal places.${qTable([[T`Class`, ...classes], [T`Frequency`, ...fs]], true)}`, a: m, tol: 0.011, w: [rnd(sum(mids) / 4, 2), rnd(S / 4, 2), rnd((S + N * w / 2) / N, 2)], s: T`Midpoints ${mids.join(LS())}; $\sum f = ${N}$, $\sum fm = ${S}$. Mean $\approx \frac{${S}}{${N}} ${Number.isInteger((S / N) * 100) ? '=' : '\\approx'} ${M(m)}$.` }; },
    () => { const Q1 = ri(10, 40), Q3 = Q1 + 2 * ri(3, 15), I = Q3 - Q1, up = chance(); return { q: T`A data set has $Q_1 = ${Q1}$ and $Q_3 = ${Q3}$. Using the $1.5 \times \text{IQR}$ rule, what is the ${up ? T`upper` : T`lower`} fence for outliers?`, a: up ? Q3 + 1.5 * I : Q1 - 1.5 * I, neg: true, w: up ? [Q3 + I, Q3 + 3 * I, Q1 + 1.5 * I] : [Q1 - I, Q1 - 3 * I, Q3 - 1.5 * I], s: T`$\text{IQR} = ${I}$ and $1.5 \times ${I} = ${M(1.5 * I)}$. ${up ? T`Upper fence $= ${Q3} + ${M(1.5 * I)} = ${M(Q3 + 1.5 * I)}$.` : T`Lower fence $= ${Q1} - ${M(1.5 * I)} = ${M(Q1 - 1.5 * I)}$.`}` }; },

{
  id: 'conics', title: 'Coordinate Geometry & Circles',
  blurb: 'Midpoints and distances, equations of circles, general form, tangents and parabolas.',
  lesson: () => T`
${Fm(T`\text{Midpoint } \left(\frac{x_1 + x_2}{2}, \frac{y_1 + y_2}{2}\right) \qquad \text{Distance } \sqrt{(x_2 - x_1)^2 + (y_2 - y_1)^2}`)}
<h3>Equation of a circle</h3>
${Key(T`$$(x - a)^2 + (y - b)^2 = r^2 \qquad \text{centre } (a, b), \text{ radius } r$$`)}
<p>Expanding gives the <b>general form</b> $x^2 + y^2 + Dx + Ey + F = 0$, with centre $\left(-\frac{D}{2}, -\frac{E}{2}\right)$ and radius $r = \sqrt{\frac{D^2}{4} + \frac{E^2}{4} - F}$.</p>
${Ex(T`<p>$x^2 + y^2 - 6x + 4y - 12 = 0$: complete the squares, $(x - 3)^2 + (y + 2)^2 = 12 + 9 + 4 = 25$. Centre $(3, -2)$, radius 5.</p>`)}
${Fig(planeSvg({ W: 320, x: [-3, 9], y: [-8, 4], equal: true, step: [1, 1], tickX: 2, tickY: 2, circles: [[3, -2, 5]], segs: [[3, -2, 7, 1, 'mf-c2']], pts: [[3, -2, cP(3, -2), 'end', false, 6, 16], [7, 1]], texts: [[5.6, -1.4, 'r = 5', 'start']], label: T`Circle with centre (3, −2) and radius 5` }), T`$(x - 3)^2 + (y + 2)^2 = 25$: centre $(3, -2)$, radius 5 (the radius to $(7, 1)$ is a 3-4-5 triangle).`)}
<h3>Position of a point</h3>
<p>Substitute the point into $(x - a)^2 + (y - b)^2$ and compare with $r^2$: smaller → inside, equal → on, larger → outside.</p>
<h3>Tangents</h3>
<p>A tangent is perpendicular to the radius at the point of contact. For the circle $x^2 + y^2 = r^2$ at $(x_1, y_1)$, the radius has slope $\frac{y_1}{x_1}$, so the tangent has slope $-\frac{x_1}{y_1}$.</p>
<h3>Parabolas</h3>
<p>$y^2 = 4px$ has focus $(p, 0)$ and directrix $x = -p$; $x^2 = 4py$ has focus $(0, p)$ and directrix $y = -p$. Every point on a parabola is the same distance from the focus as from the directrix.</p>
${Fig(planeSvg({ W: 320, x: [-4, 4], y: [-2, 5], equal: true, fns: [{ f: x => x * x / 4 }, { f: () => -1, cls: 'mf-c2', dash: true, label: T`directrix y = −1`, at: -3.8, dx: 0, dy: 16 }], segs: [[0, 1, 2, 1, 'mf-c4'], [2, 1, 2, -1, 'mf-c4', true]], pts: [[0, 1, 'F' + cP(0, 1), 'end', false, 6, -8], [2, 1, 'P' + cP(2, 1), 'start', false, 8, -6]], texts: [[-2.2, 3.6, 'x² = 4y'], [1, 1.3, '2', 'middle', 'mf-small'], [2.2, 0, '2', 'start', 'mf-small']], label: T`Parabola x² = 4y with focus (0, 1) and directrix y = −1` }), T`Every point of $x^2 = 4y$ is equally far from the focus $(0, 1)$ and the directrix $y = -1$; for $P(2, 1)$ both distances are 2.`)}
${Tip(T`<p>In $(x + 3)^2 + (y - 1)^2 = 16$ the centre is $(-3, 1)$ — the signs flip — and the radius is 4, not 16.</p>`)}`,
  gens: [
    () => { let x1, y1, x2, y2; do { x1 = ri(-9, 9); y1 = ri(-9, 9); x2 = ri(-9, 9); y2 = ri(-9, 9); } while ((x1 + x2) % 2 || (y1 + y2) % 2 || (x1 === x2 && y1 === y2)); const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, P = (p, q) => `$${pt(p, q)}$`; return { q: T`Find the midpoint of $${pt(x1, y1)}$ and $${pt(x2, y2)}$.`, a: P(mx, my), v: [mx, my], ord: true, h: T`Type the coordinates as x, y.`, w: [P((x2 - x1) / 2, (y2 - y1) / 2), P(x1 + x2, y1 + y2), P(my, mx), P(mx + 1, my - 1)], s: T`Average the coordinates: $\left(\frac{${x1} + ${pn(x2)}}{2}, \frac{${y1} + ${pn(y2)}}{2}\right) = ${pt(mx, my)}$.` }; },
    () => { const a = ri(-6, 6), b = ri(-6, 6), r = ri(1, 9), D = -2 * a, E = -2 * b, Fv = a * a + b * b - r * r; return { q: T`Find the radius of the circle $${terms([[1, 'x^2'], [1, 'y^2'], [D, 'x'], [E, 'y'], [Fv, '']])} = 0$.`, a: r, w: [r * r, Math.abs(Fv) || r + 1, r + 1], s: T`Complete the squares: $(x ${sg(-a)})^2 + (y ${sg(-b)})^2 = ${a * a} + ${b * b} ${sg(-Fv)} = ${r * r}$, so $r = ${r}$.` }; },
    () => { const a = rnz(-6, 6), b = rnz(-6, 6), r = ri(1, 9), D = -2 * a, E = -2 * b, Fv = a * a + b * b - r * r, P = (p, q) => `$${pt(p, q)}$`; return { q: T`Find the centre of the circle $${terms([[1, 'x^2'], [1, 'y^2'], [D, 'x'], [E, 'y'], [Fv, '']])} = 0$.`, a: P(a, b), v: [a, b], ord: true, h: T`Type the coordinates as x, y.`, w: [P(-a, -b), P(D, E), P(b, a)], s: T`The centre is $\left(-\frac{D}{2}, -\frac{E}{2}\right) = \left(-\frac{${D}}{2}, -\frac{${E}}{2}\right) = ${pt(a, b)}$.` }; },
    () => { const a = rnz(-6, 6), b = rnz(-6, 6), r = ri(2, 9), C = (p, q, rr) => `$(x ${sg(-p)})^2 + (y ${sg(-q)})^2 = ${rr}$`; return { q: T`Which is the equation of the circle with centre $${pt(a, b)}$ and radius ${r}?`, a: C(a, b, r * r), w: [C(-a, -b, r * r), C(a, b, r), C(b, a, r * r)], s: T`Substitute into $(x - a)^2 + (y - b)^2 = r^2$: $(x ${sg(-a)})^2 + (y ${sg(-b)})^2 = ${r * r}$.` }; },
    () => { const a = ri(-5, 5), b = ri(-5, 5), r = ri(3, 8), kind = pick(['Inside', 'On', 'Outside']), L = { Inside: [T`Inside the circle`, T`inside`], On: [T`On the circle`, T`on`], Outside: [T`Outside the circle`, T`outside`] }; let x, y, d2, R2 = r * r; if (kind === 'On') { const [u, v, rr] = pick([[3, 4, 5], [4, 3, 5], [6, 8, 10], [0, r, r], [r, 0, r]]); x = a + (chance() ? u : -u); y = b + (chance() ? v : -v); R2 = rr * rr; d2 = R2; } else { do { x = ri(a - r - 3, a + r + 3); y = ri(b - r - 3, b + r + 3); d2 = (x - a) ** 2 + (y - b) ** 2; } while ((kind === 'Inside') !== (d2 < r * r) || d2 === r * r); } const lhs = `(${M(x)} ${sg(-a)})^2 + (${M(y)} ${sg(-b)})^2 = ${d2}`; return { q: T`Is the point $${pt(x, y)}$ inside, on, or outside the circle $(x ${sg(-a)})^2 + (y ${sg(-b)})^2 = ${R2}$?`, a: L[kind][0], alt: [L[kind][1], kind.toLowerCase()], w: [L.Inside[0], L.On[0], L.Outside[0]], s: kind === 'On' ? T`$${lhs}$, which equals $r^2 = ${R2}$: the point is <b>on</b> the circle.` : kind === 'Inside' ? T`$${lhs}$, which is less than $r^2 = ${R2}$: the point is <b>inside</b> the circle.` : T`$${lhs}$, which is greater than $r^2 = ${R2}$: the point is <b>outside</b> the circle.` }; },
    () => { const p = rnz(-5, 5), xForm = chance(), P = (u, v) => `$${pt(u, v)}$`, eq = xForm ? T`y^2 = ${4 * p}x` : T`x^2 = ${4 * p}y`, f = xForm ? [p, 0] : [0, p]; return { q: T`Find the focus of the parabola $${eq}$.`, a: P(...f), v: f, ord: true, h: T`Type the coordinates as x, y.`, w: [P(...(xForm ? [4 * p, 0] : [0, 4 * p])), P(...(xForm ? [0, p] : [p, 0])), P(...(xForm ? [-p, 0] : [0, -p]))], s: T`Compare with ${xForm ? T`$y^2 = 4px$` : T`$x^2 = 4py$`}: $4p = ${4 * p}$, so $p = ${p}$ and the focus is $${pt(...f)}$.` }; },
    () => { const [a, b, c] = pick(TRIPLES.slice(0, 3)), [x, y] = signed(shuffle([a, b])); return { q: T`Find the slope of the tangent to $x^2 + y^2 = ${c * c}$ at the point $${pt(x, y)}$.`, ...FR(-x, y), h: hFrac, w: [fx(y, x), fx(x, y), fx(-y, x)], s: T`The radius to $${pt(x, y)}$ has slope $\frac{${y}}{${x}}$. The tangent is perpendicular: slope $= -\frac{${x}}{${y}} = ${frT(-x, y)}$.` }; },
  ],
},

{
  id: 'linear-programming', title: 'Linear Programming',
  blurb: 'Constraints, feasible regions, objective functions and the corner-point method.',
  lesson: () => T`
<p><b>Linear programming</b> finds the best (largest or smallest) value of a linear <b>objective function</b>, such as profit $z = 30x + 20y$, subject to linear <b>constraints</b> such as $x + y \le 40$.</p>
<ol><li>Write the constraints as inequalities (include $x \ge 0$, $y \ge 0$).</li><li>Draw each boundary line and shade the region satisfying all constraints — the <b>feasible region</b>.</li><li>Find the corner points (vertices) by solving pairs of boundary equations.</li><li>Evaluate the objective at each corner.</li></ol>
${Key(T`<p><b>Corner-point theorem:</b> if an optimum exists, it occurs at a vertex of the feasible region.</p>`)}
